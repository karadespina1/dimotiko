<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Το χωριό του Λούμι · Μαθαίνω το ποντίκι</title>
<style>
*{box-sizing:border-box}
:root{font-family:"Nunito",system-ui,sans-serif;color:#f9f6ff;background:#0b0923;color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#342168,transparent 52%),radial-gradient(ellipse at 95% 45%,#20275b,transparent 45%),#0b0923}
main{max-width:920px;margin:auto;padding:clamp(12px,4vw,42px)}
header{position:relative;margin-bottom:22px;padding:6px 0 0}
.kicker{display:inline-flex;align-items:center;gap:8px;color:#a9fff1;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.kicker::before{content:"";width:8px;height:8px;border-radius:100%;background:#7efae2;box-shadow:0 0 14px #7efae2}
h1{font-size:clamp(32px,7vw,68px);letter-spacing:-.055em;margin:3px 0 9px;line-height:1.02}
h1 span{color:#ffd990}
p{margin:0;line-height:1.45}
header p{color:#ded8f7;font-size:clamp(13px,2.8vw,16px)}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
nav button{min-height:52px;padding:6px 2px;border:1px solid #61558e;border-radius:15px;background:#221942;color:#ebe5ff;font-weight:800;font-size:clamp(11px,3vw,16px)}
nav button[aria-pressed=true]{background:#eadfff;color:#302060;border-color:#f3eaff}
.card{background:#171131;border:1px solid #534879;border-radius:26px;padding:clamp(10px,3vw,22px);box-shadow:0 18px 70px #0006}
.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
h2{font-size:clamp(19px,4.4vw,29px);margin:0;letter-spacing:-.025em}
#count{background:#39305c;color:#fff2bd;border-radius:999px;padding:6px 11px;white-space:nowrap;font-weight:800}
#instruction{color:#e8defd;margin-bottom:12px}
#board{position:relative;isolation:isolate;height:clamp(250px,47vh,420px);overflow:hidden;border:1px solid #6d5ab0;border-radius:19px;background:radial-gradient(ellipse at 78% 34%,#62489d,transparent 47%),radial-gradient(ellipse at 28% 85%,#1b6490,transparent 54%),linear-gradient(155deg,#151338,#301c60 70%,#151638);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));place-items:center;padding:8px}
.space-art{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.spark{position:absolute;border-radius:50%;background:#fff5d9;box-shadow:0 0 7px #c4b8ff}
.planet{position:absolute;right:-22px;top:12%;width:clamp(78px,18vw,157px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 27% 23%,#ffe1ac,#ee92a3 33%,#874cb3 69%,#443473);box-shadow:0 0 45px #e9a2c253;transform:rotate(-22deg)}
.planet::after{content:"";position:absolute;left:-29%;top:37%;width:154%;height:25%;border:6px solid #f3ceec99;border-top-color:#f3ceec33;border-radius:50%}
.horizon{position:absolute;width:114%;height:52%;left:-42%;bottom:-43%;border-radius:50%;background:linear-gradient(#6bb8ea,#23416f);box-shadow:0 -3px 36px #77d2ff88}
.target{display:grid;place-items:center;width:clamp(56px,16vw,76px);height:clamp(56px,16vw,76px);border:2px solid #bfedf7;border-radius:22px;background:linear-gradient(145deg,#fff,#d6e5ff);color:#22143e;box-shadow:0 4px 0 #7976bb,0 0 25px #a5c3ff70;font-size:clamp(30px,8vw,46px);line-height:1;user-select:none;z-index:1;animation:arrive .22s ease-out both}
.target:active{filter:brightness(1.15)}
.target.big{width:clamp(87px,26vw,108px);height:clamp(87px,26vw,108px);font-size:clamp(52px,12vw,65px);border-color:#ffeec4;border-radius:30px;background:linear-gradient(140deg,#fff5d8,#ffd391);box-shadow:0 5px 0 #c48c77,0 0 40px #ffc38688}
button:focus-visible{outline:3px solid #fff18b;outline-offset:4px}
#feedback{min-height:2.45em;padding-top:10px;font-weight:750;color:#a9fff1}
.finish{grid-area:1/1/4/4;text-align:center;background:#211744;border:1px solid #a595e8;border-radius:22px;padding:17px;max-width:95%;z-index:2;box-shadow:0 0 35px #ad92ff44;animation:arrive .28s ease-out both}
.trophy{font-size:48px}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.action{border:1px solid #ffe3a5;border-radius:13px;min-height:46px;padding:6px 14px;font-weight:800;background:#ffdb92;color:#31204d}
.action.secondary{background:#342658;color:#f6edff;border-color:#8570b7}
.confetti{position:absolute;width:8px;height:8px;border-radius:3px;z-index:3;pointer-events:none;animation:burst .65s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.7);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(110deg);opacity:0}}
@keyframes arrive{from{transform:scale(.78);opacity:.65}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.target,.finish{animation:none}.confetti{display:none}}
[hidden]{display:none!important}
.welcome{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:24px;min-height:440px;padding:clamp(22px,6vw,60px);border:1px solid #8c79c7;border-radius:32px;background:radial-gradient(ellipse at 75% 43%,#6350aa,#2b225d 56%,#181137);box-shadow:0 24px 70px #08041b90}
.welcome h1{max-width:11ch}
.welcome p{max-width:32ch;color:#eee7ff}
.welcome .action{margin-top:23px;padding:10px 22px;min-height:55px}
.robot{position:relative;justify-self:center;width:min(100%,235px);height:218px;display:grid;place-items:center;filter:drop-shadow(0 15px 17px #11063280)}
.robot::before{content:"";position:absolute;width:8px;height:29px;top:12px;background:#e8defe;border-radius:6px;box-shadow:0 -10px 0 3px #ffca84}
.robot::after{content:"";position:absolute;bottom:10px;width:68%;height:24px;border-radius:50%;background:#110c3366;filter:blur(5px);z-index:-1}
.robot-face{display:flex;justify-content:center;align-items:center;gap:20%;width:85%;height:116px;border:12px solid #e7dfff;border-radius:48px;background:#252054;box-shadow:inset 0 0 25px #6e67bc,0 9px #9585d5}
.robot-face::before,.robot-face::after{content:"";width:18px;height:24px;border-radius:12px;background:#a3fff3;box-shadow:0 0 17px #65ffdc}
.mouth{position:absolute;width:23px;height:12px;top:131px;border:4px solid #ffbafa;border-top:0;border-radius:0 0 20px 20px}
.orbit{position:absolute;top:22px;right:3px;color:#ffe498;font-size:32px}
.game-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.game-head h1{font-size:clamp(21px,5vw,34px);margin:0}
#home{white-space:nowrap}
.meter{display:flex;gap:5px;margin-bottom:12px}
.meter span{flex:1;height:7px;border-radius:5px;background:#3e335d}
.meter .lit{background:#8cebd8;box-shadow:0 0 8px #8cebd87a}
.target[data-kind="light"]{background:linear-gradient(#fff3bf,#ffc568);border-color:#fff0bf}
.target[data-kind="crystal"]{background:linear-gradient(#e1fff9,#a1dfff);border-color:#d8fffc}
.target[data-kind="fuel"]{background:linear-gradient(#fff0fd,#e2c7ff);border-color:#f5dfff}
.target.decoy{box-shadow:0 4px 0 #7976bb;background:#e1def2;border-color:#b8afd9}
@media(max-width:560px){.welcome{grid-template-columns:1fr;text-align:center;gap:4px;min-height:0}.welcome h1,.welcome p{margin-inline:auto}.robot{grid-row:1;height:174px;width:160px}.robot-face{height:96px;border-width:9px}.mouth{top:112px}.orbit{right:-9px}}

.map{margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.track{min-width:0;padding:12px;border-radius:20px;background:#221941;border:1px solid #65558e}
.track h2{font-size:18px;margin:0 0 10px}
.track button{width:100%;min-height:52px;margin:3px 0;padding:7px 9px;text-align:left;border:1px solid #8c78bc;color:#fff;background:#34265e;border-radius:12px;font-weight:750}
.track:nth-child(2) button{background:#234957}
.track:nth-child(3) button{background:#563364}
.track button:hover{filter:brightness(1.22)}
.track button span{float:right;color:#a9fff1}
#board[data-mode="move"]{touch-action:none}
#board[data-mode="move"] .target{touch-action:none}
.target.armed,.target.big.armed{border-color:#ffab66;box-shadow:0 0 18px #ffab6688}
@media(max-width:590px){.map{grid-template-columns:1fr;gap:8px}.track{padding:9px}.track h2{margin-bottom:3px}.track button{min-height:47px}}

#map{background:radial-gradient(circle at 83% 1%,#ffe49b 0 27px,transparent 29px),radial-gradient(ellipse at 15% 75%,#b1e1ac 30%,transparent 31%),linear-gradient(#b1ddff 0 42%,#b2e2c3 42% 100%);color:#242851;border:3px solid #e0f4ff;border-radius:30px;padding:clamp(10px,4vw,28px);box-shadow:0 15px 45px #0805249c}
.village-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:0}
.village-head h1{font-size:clamp(22px,5vw,44px)}
.village-head p{color:#353b65}
.audio{display:grid;place-items:center;flex:none;border:2px solid #fff1bf;border-radius:16px;background:#ffdb8d;color:#2e204f;width:52px;height:48px;font-size:24px;box-shadow:0 3px #a57258}
.mini-lumi{display:flex;position:relative;justify-content:center;align-items:center;gap:11px;width:66px;height:45px;flex:none;margin-left:auto;margin-right:6px;border:5px solid #f6edff;border-radius:20px;background:#342964;box-shadow:0 4px #9d88dc}
.mini-lumi::before{content:"";position:absolute;background:#8f70c6;width:4px;height:12px;top:-15px;border-radius:4px;box-shadow:0 -4px #f8899e}
.mini-lumi i,.mini-lumi b{width:8px;height:11px;border-radius:100%;background:#a2ffea}
.map{grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,1.7vw,15px);padding-top:9px}
.house{position:relative;isolation:isolate;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;min-width:0;min-height:126px;padding:28px 2px 9px;border:0;border-radius:18px;background:transparent;color:#302451;font-weight:850}
.house::before{content:"";position:absolute;z-index:-1;inset:33px 7% 0;border-radius:8px 8px 16px 16px;background:var(--wall);box-shadow:0 4px 0 #2a365b45,inset 0 0 0 2px #fff7}
.house::after{content:"";position:absolute;z-index:-1;top:1px;left:1%;width:98%;height:54px;background:var(--roof);clip-path:polygon(50% 0,100% 70%,96% 91%,50% 29%,4% 91%,0 70%);filter:brightness(.93)}
.house:hover::before,.house:focus-visible::before{filter:brightness(1.12)}
.house:focus-visible{outline-color:#322371}
.house-icon{display:grid;place-items:center;width:55px;height:53px;margin-top:6px;background:#fff9;border:2px solid #fff9;border-radius:13px;font-size:32px}
.house-number{font-size:17px;line-height:1.2;margin-top:7px}
.house-done{position:absolute;top:39px;right:10%;border-radius:30px;background:#20534d;color:white;width:22px;height:22px;line-height:22px;font-size:15px}
@media(max-width:600px){.map{grid-template-columns:repeat(3,minmax(0,1fr))}.house{min-height:102px;padding-top:21px}.house::after{height:42px}.house::before{top:26px}.house-icon{width:43px;height:41px;font-size:26px}.mini-lumi{width:48px;gap:7px;margin-right:0}.audio{width:45px}}
@media(max-width:350px){.mini-lumi{display:none}}

.gesture{display:inline-block;margin-bottom:10px;padding:4px 10px;border:1px solid #8876be;border-radius:13px;background:#352957;color:#fff1ce;font-weight:800;font-size:18px}
#instruction{margin-bottom:5px}
#board[data-mode="move"]{background:radial-gradient(ellipse at 80% 12%,#b8e9fc,transparent 60%),linear-gradient(#7fbee4 30%,#72b099 77%,#41786f)}
#board[data-mode="click"]{background:radial-gradient(ellipse at 50% 25%,#3f847f,transparent 62%),linear-gradient(160deg,#18344b,#22506a 69%,#405383)}
#board[data-mode="move"] .planet{display:none}
#board[data-mode="move"] .horizon{background:#91cf9b;box-shadow:0 -3px 35px #d6f2ad88}

.score{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#lives{white-space:nowrap;color:#ffe3ec;font-size:clamp(15px,4vw,24px);letter-spacing:1px}
.maze-piece{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);width:clamp(31px,9vw,56px);aspect-ratio:1;border-radius:50%;font-size:clamp(21px,6vw,36px);user-select:none;pointer-events:none;z-index:1}
.rabbit{background:#ffe6d2;border:2px solid #a3605970}
.carrot{background:#fff3b7;border:2px solid #fff4dc;box-shadow:0 0 15px #fda857;z-index:2}
.basket{background:#e0fbd1;border:2px dashed #286057}
.carrying{cursor:none}
#game button,#map button{touch-action:manipulation}
#board[data-mode="move"],#board[data-mode="move"] .maze-piece{touch-action:none}
@media(pointer:coarse){#board[data-mode="move"] .carrot{width:clamp(44px,11vw,60px)}}
@media(max-width:480px){
  main{padding:8px}
  .card{padding:9px}
  .game-head{margin-bottom:8px}
  .heading{gap:4px}
  .score{gap:3px}
  #count{padding:4px 7px;font-size:13px}
  #board{height:clamp(245px,47svh,355px)}
}
@media(max-height:530px) and (orientation:landscape){
  main{padding-block:7px}
  .game-head{margin-bottom:5px}
  #board{height:clamp(200px,55svh,245px)}
  .target.big{width:66px;height:66px;font-size:42px}
  #feedback{padding-top:6px}
}
.carrying .carrot{background:#fff4ceaa;width:clamp(25px,7vw,42px);font-size:clamp(19px,5vw,30px)}

body{background:radial-gradient(ellipse at 12% 0,#69379e 0,transparent 57%),radial-gradient(ellipse at 94% 55%,#167fb4,transparent 61%),#231856}
.welcome{background:radial-gradient(ellipse at 78% 45%,#a466df,#5943a6 62%,#3b267d)}
#map{background:radial-gradient(circle at 85% 5%,#ffdb62 0 27px,transparent 29px),radial-gradient(ellipse at 15% 75%,#93dc83 30%,transparent 31%),linear-gradient(#79d8ff 0 42%,#a7eb9f 42% 100%);border-color:#e8fcff}
.card{background:#30236c;border-color:#9b80db}
#board[data-mode="click"]{background:radial-gradient(ellipse at 55% 10%,#42aab0,transparent 65%),linear-gradient(160deg,#205e9a,#3477b0 69%,#7257ac)}
#board[data-mode="double"]{background:radial-gradient(ellipse at 78% 34%,#ad68d3,transparent 48%),radial-gradient(ellipse at 28% 85%,#3178c4,transparent 56%),linear-gradient(155deg,#5340a1,#7139a3 70%,#373786)}
#board[data-mode="move"]{background:radial-gradient(ellipse at 80% 12%,#e3faff,transparent 63%),linear-gradient(#73d6fd 30%,#92dc83 74%,#50aa69)}
.gesture{display:inline-flex;align-items:center;gap:9px;background:#fff4ca;color:#30235d;border-color:#ffc86f;padding:4px 11px}
.gesture-picture{font-size:30px;line-height:1.1}
.target-picture{display:block;animation:bob 1.45s ease-in-out infinite}
.decoy .target-picture{animation-delay:-.6s}
.target.armed .target-picture{animation-play-state:paused}
.rabbit{animation:rabbit-hop var(--pace) ease-in-out infinite alternate}
.orbit{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(3px) rotate(-5deg)}50%{transform:translateY(-5px) rotate(5deg)}}
@keyframes rabbit-hop{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,calc(-50% + var(--hop)))}}
@media(prefers-reduced-motion:reduce){.target-picture,.rabbit,.orbit{animation:none}}
</style>
</head>
<body>
<main>
<section class="welcome" id="welcome">
<div>
<div class="kicker">Το πρώτο μου κλικ</div>
<h1>Το χωριό του <span>Λούμι</span></h1>
<p>Ο Λούμι έχει δέκα παιχνίδια για σένα. Διάλεξε ένα σπιτάκι!</p>
<button type="button" class="action" id="launch">▶ <span>Πάμε, Λούμι!</span></button>
</div>
<div class="robot" role="img" aria-label="Ο Λούμι, ένα χαμογελαστό ρομπότ">
<div class="robot-face"><span class="mouth"></span></div><span class="orbit" aria-hidden="true">✦</span>
</div>
</section>
<section id="map" hidden aria-labelledby="map-title">
<header class="village-head">
<div><h1 id="map-title" tabindex="-1">Το χωριό του Λούμι</h1><p>Διάλεξε ένα σπιτάκι.</p></div>
<span class="mini-lumi" aria-hidden="true"><i></i><b></b></span>
<button type="button" id="map-voice" class="audio" aria-label="Άκου τις οδηγίες του χωριού">🔊</button>
</header>
<div class="map" id="tracks"></div>
</section>
<div id="game" hidden>
<header class="game-head"><button type="button" class="action secondary" id="home" aria-label="Πίσω στο χωριό">🏘️ <span class="label">Χωριό</span></button><button type="button" id="voice" class="audio" aria-label="Άκου ξανά την οδηγία">🔊</button></header>
<section class="card" aria-labelledby="level">
<div class="heading"><h2 id="level"></h2><div class="score"><span id="lives" hidden></span><span id="count" aria-label="Πρόοδος"></span></div></div>
<div class="meter" id="meter" aria-hidden="true"></div>
<p id="instruction"></p>
<div class="gesture" id="gesture" aria-hidden="true"></div>
<div id="board" tabindex="-1" aria-describedby="instruction"></div>
<p id="feedback" role="status"></p>
</section>
</div>
</main>

function showMap(announce = false) {
  clearTimeout(pairTimer);
  clearTimeout(resetTimer);
  movingFinger = null;
  welcome.hidden = true;
  game.hidden = true;
  map.hidden = false;
  trackList.replaceChildren();
  stages.forEach((stage, index) => {
    const house = document.createElement('button');
    house.type = 'button';
    house.className = 'house';
    house.setAttribute('aria-label', (index + 1) + '. ' + stage.title + (completed.has(index) ? ', ολοκληρώθηκε' : ''));
    house.style.setProperty('--roof', roofs[index % roofs.length]);
    house.style.setProperty('--wall', walls[index % walls.length]);
    const icon = document.createElement('span');
    icon.className = 'house-icon';
    icon.textContent = stage.icon;
    const number = document.createElement('span');
    number.className = 'house-number';
    number.textContent = index + 1;
    house.append(icon, number);
    if (completed.has(index)) {
      const mark = document.createElement('span');
      mark.className = 'house-done';
      mark.textContent = '✓';
      house.append(mark);
    }
    house.addEventListener('click', () => start(index));
    trackList.append(house);
  });
  mapTitle.focus();
  if (announce === true) speakVillage();
  else stopVoice();
}

document.querySelector('#launch').addEventListener('click', () => showMap(true));
document.querySelector('#home').addEventListener('click', () => showMap(true));
document.querySelector('#map-voice').addEventListener('click', speakVillage);

function speakVillage() {
  playVoice('village', 'Γεια σου! Είμαι ο Λούμι. Πάτα όποιο σπιτάκι σου αρέσει. Θα σου πω τι να κάνεις.');
}
document.querySelector('#voice').addEventListener('click', explain);

function start(index) {
  clearTimeout(resetTimer);
  resetPending = false;
  level = index;
  points = 0;
  lives = 3;
  movingFinger = null;
  map.hidden = true;
  game.hidden = false;
  feedback.textContent = '';
  render(true);
  explain();
}

function explain() {
  const stage = stages[level];
  playVoice('stage' + level + (touch ? '-touch' : '-mouse'), stage.say + ' ' + instructions(stage).replace(' ' + stage.icon, ''));
}

let voicePlayer;
function stopVoice() {
  if (voicePlayer) voicePlayer.pause();
  voicePlayer = undefined;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
function playVoice(key, message) {
  stopVoice();
  const fallback = () => {
    if (!window.speechSynthesis) return;
    const utterance = new SpeechSynthesisUtterance(message);
    utterance.lang = 'el-GR';
    utterance.rate = .85;
    const greek = window.speechSynthesis.getVoices().find(voice => voice.lang.startsWith('el'));
    if (greek) utterance.voice = greek;
    window.speechSynthesis.speak(utterance);
  };
  const recording = recordings[key];
  if (!recording) {
    fallback();
    return;
  }
  const player = new Audio(recording);
  voicePlayer = player;
  player.play().catch(() => { if (voicePlayer === player) fallback(); });
}

function instructions(stage) {
  if (stage.mode === 'move') return touch
    ? 'Σύρε το καρότο με το δάχτυλο ως το καλάθι. Απόφυγε τους λαγούς. Έχεις τρεις ζωές.'
    : 'Πέρασε τον δείκτη πάνω από το καρότο και πήγαινέ το στο καλάθι, χωρίς κλικ. Απόφυγε τους λαγούς. Έχεις τρεις ζωές.';
  if (stage.mode === 'double') return touch
    ? 'Άγγιξε ' + stage.object + ' δύο φορές γρήγορα.'
    : 'Κάνε διπλό αριστερό κλικ πάνω ' + onObject(stage.object) + '.';
  return touch
    ? 'Άγγιξε ' + stage.object + ' μία φορά.'
    : 'Κάνε ένα αριστερό κλικ πάνω ' + onObject(stage.object) + '.';
}

function onObject(object) {
  return object.replace(/^τον /, 'στον ').replace(/^το /, 'στο ').replace(/^την /, 'στην ').replace(/^τη /, 'στη ');
}

function target(icon, name, cell, correct) {
  const stage = stages[level];
  const button = document.createElement('button');
  button.type = 'button';
  button.className = stage.big ? 'target big' : 'target';
  const picture = document.createElement('span');
  picture.className = 'target-picture';
  picture.textContent = icon;
  button.append(picture);
  if (!correct) button.classList.add('decoy');
  button.setAttribute('aria-label', name);
  button.style.gridArea = (Math.floor(cell / 3) + 1) + '/' + (cell % 3 + 1);
  if (correct) targetButton = button;
  button.addEventListener('click', event => {
    if (event.button !== 0 || resetPending) return;
    if (!correct) {
      loseLife();
      return;
    }
    if (stage.mode === 'double' && !button.classList.contains('armed')) {
      button.classList.add('armed');
      feedback.textContent = 'Άλλη μία φορά, γρήγορα!';
      pairTimer = setTimeout(() => {
        button.classList.remove('armed');
        feedback.textContent = 'Δοκίμασε δύο γρήγορα πατήματα.';
      }, 650);
      return;
    }
    advance(event.detail === 0);
  });
  board.append(button);
}

function advance(keepFocus) {
  const stage = stages[level];
  const cell = stage.mode === 'move' ? 5 : stage.cells[points];
  points++;
  feedback.textContent = 'Μπράβο! ' + points + ' από ' + stage.cells.length + '.';
  render(keepFocus);
  celebrate(cell);
}

function render(keepFocus = false) {
  clearTimeout(pairTimer);
  const stage = stages[level];
  board.dataset.mode = stage.mode;
  board.classList.remove('carrying');
  carrying = false;
  previousPoint = undefined;
  hearts.hidden = false;
  hearts.textContent = '❤️'.repeat(lives) + '♡'.repeat(3 - lives);
  hearts.setAttribute('aria-label', 'Ζωές: ' + lives);
  const gesture = document.querySelector('#gesture');
  gesture.replaceChildren();
  if (stage.mode === 'move') {
    gesture.textContent = '🥕 ↝ 🧺 · 🐇';
  } else {
    const picture = document.createElement('span');
    picture.className = 'gesture-picture';
    picture.textContent = stage.icon;
    const clicks = document.createElement('span');
    clicks.textContent = stage.mode === 'double' ? '👆 👆' : '👆';
    gesture.append(picture, clicks);
  }
  document.querySelector('#level').textContent = stage.title;
  document.querySelector('#instruction').textContent = instructions(stage);
  document.querySelector('#count').textContent = points + ' / ' + stage.cells.length;
  meter.replaceChildren();
  for (let i = 0; i < stage.cells.length; i++) {
    const bar = document.createElement('span');
    if (i < points) bar.className = 'lit';
    meter.append(bar);
  }
  board.replaceChildren(sky);
  targetButton = undefined;
  if (points === stage.cells.length) {
    showFinish(keepFocus);
    return;
  }
  if (stage.mode === 'move') {
    drawMaze();
    if (keepFocus) board.focus();
    return;
  }
  const cell = stage.cells[points];
  target(stage.icon, stage.name, cell, true);
  if (stage.decoys) {
    stage.decoys.forEach(([icon, name], index) => target(icon, name, (cell + [2,4,7][index]) % 9, false));
  }
  if (keepFocus) targetButton.focus();
}

function piece(icon, kind, x, y) {
  const item = document.createElement('span');
  item.className = 'maze-piece ' + kind;
  item.textContent = icon;
  item.setAttribute('aria-hidden','true');
  item.style.left = x + '%';
  item.style.top = y + '%';
  board.append(item);
  return item;
}

function drawMaze() {
  carrot = piece('🥕', 'carrot', 12, 49);
  basket = piece('🧺', 'basket', 88, 49);
  rabbits = rabbitPaths[points].map(([x,y], index) => {
    const rabbit = piece('🐇', 'rabbit', x, y);
    rabbit.style.setProperty('--hop', index % 2 === 0 ? '22px' : '-22px');
    rabbit.style.setProperty('--pace', (1.05 + index * .21) + 's');
    return rabbit;
  });
}

function near(item, x, y, scale = 1) {
  const rect = item.getBoundingClientRect();
  return Math.hypot(x - (rect.left + rect.width / 2), y - (rect.top + rect.height / 2)) <= rect.width * scale / 2;
}

function moveCarrot(x, y) {
  if (resetPending || !carrot?.isConnected || points >= rabbitPaths.length) return;
  if (!carrying) {
    if (!near(carrot, x, y)) return;
    carrying = true;
    board.classList.add('carrying');
  }
  const rect = board.getBoundingClientRect();
  if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) {
    returnCarrot();
    return;
  }
  const origin = previousPoint ?? [x,y];
  const steps = Math.max(1, Math.ceil(Math.hypot(x - origin[0], y - origin[1]) / 8));
  for (let step = 1; step <= steps; step++) {
    const sampleX = origin[0] + (x - origin[0]) * step / steps;
    const sampleY = origin[1] + (y - origin[1]) * step / steps;
    if (rabbits.some(rabbit => near(rabbit, sampleX, sampleY, 1.12))) {
      loseLife(true);
      return;
    }
    if (near(basket, sampleX, sampleY)) {
      advance(false);
      return;
    }
  }
  previousPoint = [x,y];
  carrot.style.left = (x - rect.left) / rect.width * 100 + '%';
  carrot.style.top = (y - rect.top) / rect.height * 100 + '%';
}

function returnCarrot() {
  carrying = false;
  previousPoint = undefined;
  board.classList.remove('carrying');
  if (carrot?.isConnected) {
    carrot.style.left = '12%';
    carrot.style.top = '49%';
  }
}

function loseLife(rabbit = false) {
  if (resetPending || game.hidden) return;
  lives--;
  render();
  if (lives > 0) {
    feedback.textContent = rabbit ? 'Ωχ, ένας λαγός!' : 'Δοκίμασε το ' + stages[level].icon + '!';
    if (rabbit) playVoice('rabbit', 'Ωχ, ένας λαγός! Δοκίμασε άλλο δρόμο.');
    else playVoice('mistake', 'Ωχ! Κοίτα την εικόνα στο πάνω μέρος και δοκίμασε ξανά.');
    return;
  }
  resetPending = true;
  feedback.textContent = 'Από την αρχή, με τρεις νέες ζωές!';
  playVoice('restart', 'Έχασες τις τρεις ζωές. Πάμε πάλι από την αρχή!');
  resetTimer = setTimeout(() => {
    points = 0;
    lives = 3;
    resetPending = false;
    render();
  }, 3000);
}

function checkMovingRabbits() {
  if (carrying && previousPoint && !game.hidden && rabbits.some(rabbit => near(rabbit, ...previousPoint, 1.12))) loseLife(true);
  requestAnimationFrame(checkMovingRabbits);
}
requestAnimationFrame(checkMovingRabbits);

board.addEventListener('click', event => {
  if (event.button !== 0 || resetPending || !targetButton || event.target.closest('button')) return;
  if (board.dataset.mode !== 'move') loseLife();
});
board.addEventListener('pointerdown', event => {
  if (board.dataset.mode !== 'move' || event.pointerType === 'mouse' || !event.isPrimary || !carrot?.isConnected) return;
  movingFinger = event.pointerId;
  board.setPointerCapture(event.pointerId);
  moveCarrot(event.clientX, event.clientY);
});
board.addEventListener('pointermove', event => {
  if (board.dataset.mode !== 'move') return;
  if (event.pointerType === 'mouse' || event.pointerId === movingFinger) moveCarrot(event.clientX, event.clientY);
});
board.addEventListener('pointerleave', event => {
  if (event.pointerType === 'mouse') returnCarrot();
});
board.addEventListener('lostpointercapture', event => {
  if (event.pointerId !== movingFinger) return;
  movingFinger = null;
  returnCarrot();
});

function celebrate(cell) {
  const colors = ['#ffe191', '#a5f5ec', '#ffb9ed', '#c4a9ff'];
  for (let index = 0; index < 12; index++) {
    const dot = document.createElement('span');
    const angle = index * Math.PI / 6;
    const distance = 32 + (index % 3) * 13;
    dot.className = 'confetti';
    dot.setAttribute('aria-hidden', 'true');
    dot.style.left = `${((cell % 3 + .5) / 3) * 100}%`;
    dot.style.top = `${((Math.floor(cell / 3) + .5) / 3) * 100}%`;
    dot.style.background = colors[index % colors.length];
    dot.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
    dot.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
    board.append(dot);
    setTimeout(() => dot.remove(), 680);
  }
}

function showFinish(keepFocus) {
  completed.add(level);
  playVoice('done', 'Μπράβο! Πάτα τα σπιτάκια για να γυρίσεις στο χωριό, ή το κυκλικό βέλος για να παίξεις ξανά.');
  feedback.textContent = 'Ολοκλήρωσες το παιχνίδι!';
  const panel = document.createElement('div');
  panel.className = 'finish';
  panel.innerHTML = '<div class="trophy" aria-hidden="true">🌟</div><h2>Μπράβο!</h2>';
  const actions = document.createElement('div');
  actions.className = 'actions';
  const back = action('🏘️', () => showMap(true), false, 'Πίσω στο χωριό');
  actions.append(back, action('🔄', () => start(level), true, 'Παίξε ξανά'));
  panel.append(actions);
  board.append(panel);
  if (keepFocus) back.focus();
}

function action(label, run, secondary, accessibleName) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.className = secondary ? 'action secondary' : 'action';
  button.addEventListener('click', run);
  return button;
}

board.addEventListener('contextmenu', event => event.preventDefault());
</script>
</body>
