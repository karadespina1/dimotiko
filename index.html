<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Διαδραστικές Δραστηριότητες Δημοτικού</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef7ff, #fff8e7);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #234;
            font-size: 38px;
            margin-bottom: 10px;
        }

        /* ΟΝΟΜΑ ΕΚΠΑΙΔΕΥΤΙΚΟΥ */

        .teacher-name {
            color: #234;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #666;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .classes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .class-card {
            display: block;
            text-decoration: none;
            color: white;
            padding: 35px 20px;
            border-radius: 25px;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .class-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 14px 25px rgba(0,0,0,0.20);
        }

        .emoji {
            display: block;
            font-size: 55px;
            margin-bottom: 15px;
        }

        .a {
            background: linear-gradient(135deg, #43a047, #81c784);
        }

        .b {
            background: linear-gradient(135deg, #1976d2, #64b5f6);
        }

        .g {
            background: linear-gradient(135deg, #f9a825, #ffd54f);
        }

        .d {
            background: linear-gradient(135deg, #ef6c00, #ffb74d);
        }

        .e {
            background: linear-gradient(135deg, #d32f2f, #ef5350);
        }

        .st {
            background: linear-gradient(135deg, #7b1fa2, #ba68c8);
        }

        footer {
            margin-top: 50px;
            color: #777;
            font-size: 15px;
        }

        @media (max-width: 1100px), (orientation: portrait) {
            body {
                padding: 1.25rem .5rem;
            }

            .container {
                width: 100%;
                max-width: none;
            }

            h1 {
                font-size: 1.875rem;
                line-height: 1.2;
                margin-bottom: .625rem;
            }

            .teacher-name {
                font-size: 1.375rem;
                margin-bottom: .625rem;
            }

            .subtitle {
                font-size: 1.25rem;
                margin-bottom: 1.5rem;
            }

            .classes {
                grid-template-columns: minmax(0, 1fr);
                gap: .875rem;
            }

            .class-card {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: .75rem;
                min-height: 4.5rem;
                padding: .875rem;
                border-radius: 1rem;
                font-size: 1.5rem;
                line-height: 1.25;
            }

            .emoji {
                font-size: 1.75rem;
                margin-bottom: 0;
            }

            footer {
                margin-top: 1.75rem;
                font-size: 1rem;
            }
        }

        /* Keep text readable when a tall display scales down a wide viewport. */
        @media (min-width: 671px) and (orientation: portrait) {
            html {
                font-size: clamp(1rem, 4.4vw, 3rem);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            📚 Διαδραστικές Δραστηριότητες
        </h1>

        <div class="teacher-name">
            Καραγιαννίδου Δέσποινα
        </div>

        <p class="subtitle">
            Επιλέξτε την τάξη σας
        </p>

        <div class="classes">

            <a class="class-card a"
               href="https://karadespina1.github.io/A-dimotikou/">

                <span class="emoji">🟢</span>

                Α΄ Δημοτικού

            </a>


            <a class="class-card b"
               href="https://karadespina1.github.io/B-dimotikou/">

                <span class="emoji">🔵</span>

                Β΄ Δημοτικού

            </a>


            <a class="class-card g"
               href="https://karadespina1.github.io/G-dimotikou/">

                <span class="emoji">🟡</span>

                Γ΄ Δημοτικού

            </a>


            <a class="class-card d"
               href="https://karadespina1.github.io/D-dimotikou/">

                <span class="emoji">🟠</span>

                Δ΄ Δημοτικού

            </a>


            <a class="class-card e"
               href="https://karadespina1.github.io/E-dimotikou/">

                <span class="emoji">🔴</span>

                Ε΄ Δημοτικού

            </a>


            <a class="class-card st"
               href="https://karadespina1.github.io/ST-dimotikou/">

                <span class="emoji">🟣</span>

                ΣΤ΄ Δημοτικού

            </a>

        </div>

        <footer>
            Διαδραστικό εκπαιδευτικό υλικό για το Δημοτικό
        </footer>

    </div>

</body>

</html>
