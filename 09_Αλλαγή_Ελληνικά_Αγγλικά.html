lign-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:900}.pill{background:#f0e9ff;border-radius:20px;padding:8px 13px}.track{height:17px;border-radius:20px;background:#e6e1f3;overflow:hidden;margin:14px 0 19px}.fill{height:100%;background:linear-gradient(90deg,#77d7ff,#9b7dff,#ff80c1);width:0;transition:width .3s}.task{background:linear-gradient(150deg,#f1e9ff,#fff0f8);border:3px solid #dfd0ff;border-radius:22px;padding:16px 12px;margin:14px 0}.flag{font-size:clamp(26px,5vw,39px)}.word{font-size:clamp(34px,8vw,66px);font-weight:1000;color:#4e35a1;line-height:1.25;overflow-wrap:anywhere}.hint{font-size:clamp(17px,3vw,21px);font-weight:800}.lang{display:inline-block;padding:8px 14px;border-radius:15px;background:#fff;font-size:clamp(16px,3vw,22px);font-weight:1000;border:2px solid #d4c4f8;margin:5px}.answer{display:block;width:100%;max-width:540px;margin:15px auto 10px;padding:16px 15px;border:4px solid #c6b5fa;border-radius:19px;background:#fff;font-size:clamp(24px,5vw,32px);text-align:center;font-weight:750;color:#302865}.answer::placeholder{font-weight:500;font-size:clamp(15px,3vw,19px)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.feedback{min-height:65px;padding:12px;margin-top:13px;border-radius:15px;font-weight:850;font-size:clamp(16px,2.8vw,19px)}.feedback.ok{background:#dcffe8;color:#23683e}.feedback.bad{background:#fff0d4;color:#88501d}.feedback.neutral{background:#eaf4ff;color:#34538b}.stamps{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}.stamp{width:43px;height:43px;display:grid;place-items:center;background:#f2edff;border:2px solid #cfc2f5;border-radius:13px;font-size:25px}.stamp.done{background:#fff1b0;border-color:#ffc963}.credit{font-size:13px;text-align:center;color:#41397b;font-weight:800;margin:22px 0}.confetti{position:fixed;top:-30px;width:10px;height:18px;pointer-events:none;animation:fall var(--dur) linear forwards;z-index:10}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.7}}.celebrate{animation:pop .6s ease-in-out infinite alternate}@keyframes pop{to{transform:scale(1.1) rotate(-4deg)}}.note{font-size:14px;color:#625e75}
@media(max-width:600px){.guide{grid-template-columns:1fr}.card{margin-top:12px}.tip{padding:12px}.top{padding:8px}.brand{font-size:16px}.hero{font-size:68px}.card{padding:15px 12px}.actions button{flex:1}.word{font-size:clamp(32px,10vw,52px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<style id="portrait-mobile-support">

<body>
<div class="shell"><header class="top"><div class="brand">🌍 Το Μαγικό Διαβατήριο των Γλωσσών</div><button class="mini" id="mute" aria-label="Σίγαση ήχου">🔊 Ήχος</button></header><main id="app" aria-live="polite"></main><footer class="credit">Δημιουργία: Δέσποινα Καραγιαννίδου</footer></div>
<script>
"use strict";
/* ============================================================
   ΡΥΘΜΙΣΕΙΣ ΚΑΙ ΠΕΡΙΕΧΟΜΕΝΟ: αλλάζεις εδώ τις λέξεις και τα κείμενα.
   prompt = ελληνική σημασία / εικόνα, answer = ακριβής λέξη.
   Η εναλλαγή γλώσσας γίνεται στο ΠΡΑΓΜΑΤΙΚΟ πληκτρολόγιο.
   ============================================================ */
const CONFIG={
 title:"Το Μαγικό Διαβατήριο των Γλωσσών",
 rounds:[
  {language:"el",prompt:"🍎",clue:"Γράψε το όνομα του φρούτου.",answer:"μήλο"},
  {language:"en",prompt:"🐱",clue:"Γράψε τη λέξη «γάτα» στα αγγλικά.",answer:"cat"},
  {language:"el",prompt:"🌞",clue:"Γράψε τη λέξη για τον ήλιο.",answer:"ήλιος"},
  {language:"en",prompt:"🐶",clue:"Γράψε τη λέξη «σκύλος» στα αγγλικά.",answer:"dog"},
  {language:"el",prompt:"🏠",clue:"Γράψε τη λέξη για το σπίτι.",answer:"σπίτι"},
  {language:"en",prompt:"📚",clue:"Γράψε τη λέξη «βιβλίο» στα αγγλικά.",answer:"book"},
  {language:"el",prompt:"💧",clue:"Γράψε τη λέξη για το νερό.",answer:"νερό"},
  {language:"en",prompt:"⭐",clue:"Γράψε τη λέξη «αστέρι» στα αγγλικά.",answer:"star"},
  {language:"el",prompt:"🌸",clue:"Γράψε τη λέξη για το λουλούδι.",answer:"λουλούδι"},
  {language:"en",prompt:"🖥️",clue:"Γράψε τη λέξη «υπολογιστής» στα αγγλικά.",answer:"computer"},
  {language:"el",prompt:"🐟",clue:"Γράψε τη λέξη για το ψάρι.",answer:"ψάρι"},
  {language:"en",prompt:"🌳",clue:"Γράψε τη λέξη «δέντρο» στα αγγλικά.",answer:"tree"}
 ],
 messages:{correct:["Μπράβο! Το διαβατήριο πήρε σφραγίδα! 🌟","Υπέροχα! Συνέχισε το ταξίδι! 🎉","Τέλεια αλλαγή γλώσσας! ✨"],wrong:"Δοκίμασε ξανά! Έλεγξε τη γλώσσα του πληκτρολογίου και τα γράμματα."}
};
const app=document.getElementById("app"),mute=document.getElementById("mute");
let index=0,mistakes=0,sound=true,ac=null,locked=false;
function beep(kind){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();let t=ac.currentTime;let tones=kind==="win"?[523,659,784,1047]:kind==="ok"?[587,784]:[260,200];tones.forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.13);g.gain.exponentialRampToValueAtTime(.12,t+i*.13+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.13+.13);o.connect(g).connect(ac.destination);o.start(t+i*.13);o.stop(t+i*.13+.14)})}catch(e){}}
mute.addEventListener("click",()=>{sound=!sound;mute.textContent=sound?"🔊 Ήχος":"🔇 Σίγαση"});
function renderIntro(){app.innerHTML=`<section class="card"><div class="hero">🌍🧒👧✨</div><h1>Το Μαγικό Διαβατήριο των Γλωσσών!</h1><p class="sub">Ταξίδεψε από τα <b>Ελληνικά 🇬🇷</b> στα <b>Αγγλικά 🇬🇧</b>!<br>Διάβασε τη γλώσσα, άλλαξε πληκτρολόγιο και γράψε τη σωστή λέξη.</p><button class="primary" id="guide">⌨️ Μάθε πώς αλλάζουμε γλώσσα</button><p class="note">12 λέξεις • Χωρίς χρονόμετρο • Με τόνους στα ελληνικά</p></section>`;document.getElementById("guide").onclick=renderGuide}
function renderGuide(){app.innerHTML=`<section class="card"><div class="hero">⌨️🌈</div><h2>Πώς αλλάζω γλώσσα;</h2><p class="sub">Στον υπολογιστή με <b>Windows</b> μπορείς να αλλάξεις από Ελληνικά σε Αγγλικά με <b>δύο τρόπους</b>!</p>
<div class="guide">
<div class="tip"><strong>1️⃣ Με τα πλήκτρα Alt + Shift</strong><p>Κρατάω πατημένο το <b>Alt</b> και πατάω το <b>Shift</b>.</p>
<div class="visual-demo" role="img" aria-label="Ζωγραφισμένο πληκτρολόγιο με το αριστερό Shift και το αριστερό Alt φωτισμένα κίτρινα"><div class="keyboard-picture"><div class="kb-row"><span class="kb-key dim">Tab</span><span class="kb-key">Q</span><span class="kb-key">W</span><span class="kb-key">E</span><span class="kb-key">R</span><span class="kb-key">T</span><span class="kb-key">Y</span><span class="kb-key">U</span><span class="kb-key">I</span><span class="kb-key">O</span></div><div class="kb-row"><span class="kb-key dim">Caps</span><span class="kb-key">A</span><span class="kb-key">S</span><span class="kb-key">D</span><span class="kb-key">F</span><span class="kb-key">G</span><span class="kb-key">H</span><span class="kb-key">J</span><span class="kb-key">K</span><span class="kb-key">L</span></div><div class="kb-row"><span class="kb-key lit wide">⇧ Shift</span><span class="kb-key">Z</span><span class="kb-key">X</span><span class="kb-key">C</span><span class="kb-key">V</span><span class="kb-key">B</span><span class="kb-key">N</span><span class="kb-key">M</span><span class="kb-key dim wide">Shift</span></div><div class="kb-row"><span class="kb-key dim">Ctrl</span><span class="kb-key dim">⊞</span><span class="kb-key lit">Alt</span><span class="kb-key long">Κενό</span><span class="kb-key dim">Alt</span><span class="kb-key dim">Ctrl</span></div></div><div class="demo-caption">🟡 Τα δύο κίτρινα πλήκτρα πατάμε μαζί!</div></div></div>
<div class="tip pink"><strong>2️⃣ Από τη γραμμή εργασιών</strong><p>Κάτω <b>δεξιά</b> στην οθόνη πατάω την ένδειξη <b>ΕΛ</b> ή <b>ENG</b> και επιλέγω τη γλώσσα που θέλω.</p><div class="visual-demo" role="img" aria-label="Ζωγραφισμένη οθόνη Windows: στη γραμμή εργασιών κάτω δεξιά φωτίζεται η ένδειξη ΕΛ και εμφανίζονται επιλογές Ελληνικά και Αγγλικά"><div class="taskbar-picture"><div class="desktop-wallpaper">🖥️ ✨</div><div class="taskbar-strip"><span class="taskbar-left">⊞ 📁 🌐</span><span class="taskbar-space"></span><span>🔊</span><span class="taskbar-language">ΕΛ 👆</span><span class="taskbar-clock">12:30</span></div></div><div class="demo-arrow">⬇️</div><div class="lang-menu"><div class="lang-choice">🇬🇷 ΕΛ — Ελληνικά</div><div class="lang-choice">🇬🇧 ENG — Αγγλικά</div></div><div class="demo-caption">🟡 Πατάω «ΕΛ / ENG» κάτω δεξιά!</div></div></div>
</div><div class="guide-note">📱 <b>Σε κινητό ή tablet:</b> πατάω το πλήκτρο <b>🌐</b> στο πληκτρολόγιο οθόνης ή κρατώ πατημένο το <b>κενό</b>, αν το υποστηρίζει η συσκευή. Επιλέγω Ελληνικά ή Αγγλικά.</div><p class="note">✍️ <b>Στις ελληνικές λέξεις βάζω πάντα τον σωστό τόνο!</b> Το πλήκτρο του τόνου είναι δίπλα στο Λ: πρώτα τόνος (΄), μετά φωνήεν (π.χ. ΄ + η = ή).<br><br>💡 Οι δύο γλώσσες πρέπει να είναι εγκατεστημένες. Οι συντομεύσεις και οι ενδείξεις μπορεί να διαφέρουν ανάλογα με τις ρυθμίσεις.</p><p><button class="primary" id="start">🚀 Ξεκίνα το ταξίδι!</button></p></section>`;document.getElementById("start").onclick=()=>{index=0;mistakes=0;renderGame()}}

function normalize(s){return s.trim().normalize("NFC").toLocaleLowerCase("el-GR")}
function stripAccents(s){return normalize(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC")}
function languageMatches(s,language){let letters=(s.match(/[A-Za-zΑ-Ωα-ωΆ-Ώά-ώϊϋΐΰ]/g)||[]).join("");if(!letters)return true;return language==="el"? !/[A-Za-z]/.test(letters):!/[Α-Ωα-ωΆ-Ώά-ώϊϋΐΰ]/.test(letters)}
function renderGame(){locked=false;const item=CONFIG.rounds[index],el=item.language==="el";app.innerHTML=`<section class="card"><div class="status"><span class="pill">🧭 Στάση ${index+1} / ${CONFIG.rounds.length}</span><span class="pill">⭐ ${index} σφραγίδες</span></div><div class="track"><div class="fill" style="width:${index/CONFIG.rounds.length*100}%"></div></div><div class="task"><div class="flag">${el?"🇬🇷":"🇬🇧"}</div><div class="lang">${el?"ΓΡΑΨΕ ΕΛΛΗΝΙΚΑ":"WRITE IN ENGLISH"}</div><div class="word">${item.prompt}</div><div class="hint">${item.clue}</div>${el?"":`<div class="english-model"><span>👀 Κοίτα τη λέξη και αντίγραψέ την:</span><strong lang="en">${item.answer}</strong></div>`}</div><div id="form"><label for="answer" class="hint">✍️ ${el?"Γράψε τη λέξη με τον σωστό τόνο:":"Αντίγραψε την αγγλική λέξη:"}</label><input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="${el?"Πληκτρολόγησε στα ελληνικά":"Type in English"}" aria-label="Η απάντησή σου"><div class="actions"><button class="primary" type="button" id="checkAnswer">✔ Έλεγχος</button><button class="secondary" type="button" id="remind">⌨️ Αλλαγή γλώσσας</button></div></div><div class="feedback neutral" id="feedback" role="status">💡 ${el?"Γράψε με ελληνικά γράμματα και βάλε τον σωστό τόνο!":"Κοίτα την αγγλική λέξη από πάνω και γράψ’ την με αγγλικά γράμματα."}</div><div class="stamps">${CONFIG.rounds.map((_,i)=>`<span class="stamp ${i<index?"done":""}">${i<index?"⭐":"○"}</span>`).join("")}</div></section>`;document.getElementById("checkAnswer").addEventListener("click",check);document.getElementById("answer").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check()}});document.getElementById("remind").onclick=()=>{const f=document.getElementById("feedback");f.className="feedback neutral";f.textContent="🖥️ Windows: Alt + Shift ή πάτημα στο ΕΛ / ENG κάτω δεξιά στη γραμμή εργασιών. 🇬🇷 Τόνος: πλήκτρο δίπλα στο Λ, μετά φωνήεν. 📱 Κινητό/tablet: 🌐 ή παρατεταμένο πάτημα στο κενό."};}
function check(){if(locked)return;const item=CONFIG.rounds[index],input=document.getElementById("answer"),value=input.value.trim(),f=document.getElementById("feedback");if(!value){f.className="feedback bad";f.textContent="✍️ Γράψε πρώτα τη λέξη!";input.focus();return}if(!languageMatches(value,item.language)){mistakes++;beep("bad");f.className="feedback bad";f.textContent=item.language==="el"?"🔄 Έχεις αγγλικό πληκτρολόγιο! Άλλαξε σε Ελληνικά.":"🔄 Έχεις ελληνικό πληκτρολόγιο! Άλλαξε σε Αγγλικά.";input.focus();return}if(item.language==="el" && stripAccents(value)===stripAccents(item.answer) && normalize(value)!==normalize(item.answer)){mistakes++;beep("bad");f.className="feedback bad";f.textContent="🔔 Σωστά γράμματα! Ξέχασες ή έβαλες λάθος τον τόνο. Πάτησε το πλήκτρο δίπλα στο Λ και μετά το φωνήεν.";input.focus();return}if(normalize(value)!==normalize(item.answer)){mistakes++;beep("bad");f.className="feedback bad";f.textContent=CONFIG.messages.wrong+" 💡 "+(item.language==="el"?"Πρόσεξε και τον τόνο. Το πλήκτρο τόνου είναι δίπλα στο Λ.":"Πρόσεξε την ορθογραφία.");input.focus();return}locked=true;beep("ok");index++;if(index===CONFIG.rounds.length){renderWin();return}renderGame();const f2=document.getElementById("feedback");f2.className="feedback ok";f2.textContent="🌟 Μπράβο! Η προηγούμενη απάντηση ήταν σωστή. Προχώρησες στην επόμενη λέξη!";}

function renderWin(){beep("win");app.innerHTML=`<section class="card"><div class="hero celebrate">🏆🌍🎊</div><h1>Μπράβο, εξερευνητή!</h1><p class="sub">Τα κατάφερες! Έγραψες λέξεις στα <b>Ελληνικά</b> και στα <b>Αγγλικά</b> και έμαθες να αλλάζεις γλώσσα στο πληκτρολόγιο!</p><div class="stamps">${Array.from({length:12},()=>'<span class="stamp done">⭐</span>').join("")}</div><p class="sub"><b>12 / 12 σφραγίδες!</b></p><button class="primary" id="again">🔄 Παίξε ξανά</button></section>`;document.getElementById("again").onclick=()=>{index=0;mistakes=0;renderGame()};confetti()}
function confetti(){if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<65;i++){let el=document.createElement("span");el.className="confetti";el.style.left=Math.random()*100+"vw";el.style.background=["#ff74a5","#ffdf62","#65d4fc","#9e7cff","#71dc9a"][i%5];el.style.setProperty("--dx",(Math.random()*180-90)+"px");el.style.setProperty("--dur",(2+Math.random()*2.5)+"s");document.body.appendChild(el);setTimeout(()=>el.remove(),4800)}}
renderIntro();
</script></body></html>
