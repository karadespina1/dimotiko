<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ένα και μόνο κενό!</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:linear-gradient(135deg,#b7edff,#e2c6ff,#ffe4c9);font-family:system-ui,sans-serif;color:#293158;min-height:100vh}.app{max-width:790px;margin:auto}.card{background:#fffdf9;border:4px solid white;border-radius:25px;padding:clamp(14px,4vw,28px);box-shadow:0 9px 0 #8171b555;text-align:center;margin:15px 0}h1{font-size:clamp(29px,6vw,45px);color:#6340b7;margin:8px}h2{color:#6340b7}.big{font-size:clamp(23px,5vw,34px);font-weight:1000}.rule{background:#fff0a6;border:4px solid #f4b637;border-radius:19px;padding:15px;margin:16px 0;font-size:clamp(23px,5vw,36px);font-weight:1000;color:#82410b}.keyboards{background:#e4eaf4;border:3px solid #c8d0e1;border-radius:18px;padding:12px;margin:12px auto;max-width:610px}.keyrow{display:flex;gap:5px;justify-content:center;margin:5px 0}.key{flex:1;background:#fff;border:2px solid #c4c9d7;border-bottom:5px solid #aeb5c5;border-radius:8px;padding:9px 1px;font-weight:900;font-size:clamp(11px,2.7vw,17px)}.space{flex:6;background:#ffda58;border-color:#f1a636;box-shadow:0 0 0 3px #ffd34a66}.example{font-size:clamp(23px,5vw,38px);font-weight:900;background:#f3efff;padding:13px;border-radius:16px;overflow-wrap:anywhere}.gap{display:inline-block;background:#fcd65c;border-radius:6px;min-width:21px;height:1.1em;vertical-align:middle}.wrong{background:#ffe2e2;border-radius:6px;color:#b52b3e}.btn{border:0;border-bottom:5px solid #d1842f;border-radius:16px;background:linear-gradient(#ffe47c,#ffb74d);padding:13px 19px;font-size:clamp(18px,3.5vw,23px);font-weight:900;color:#743f13;cursor:pointer;min-height:55px;margin:6px}.btn.secondary{background:#e9e0ff;border-color:#a791e2;color:#52369a}.btn:active{transform:translateY(3px);border-bottom-width:2px}.answer{font:800 clamp(21px,4vw,30px) system-ui;width:100%;max-width:650px;border:4px solid #c8b5fa;border-radius:15px;padding:14px;text-align:center;color:#3c2c7a}.msg{min-height:64px;padding:12px;margin:12px 0;background:#e9f3ff;border-radius:15px;font-size:18px;font-weight:800}.msg.bad{background:#ffe7e7;color:#9b2f37}.msg.good{background:#ddffe7;color:#256a40}.label{font-weight:850;font-size:18px}.credit{text-align:center;font-size:13px;font-weight:800;color:#524178}.counter{font-weight:900;color:#603dba}.highlight{background:#ffde68;padding:0 5px;border-radius:5px}@media(max-width:480px){.key{padding:8px 0}.card{padding:15px 9px}} </style><style id="portrait-mobile-support">
/* Προσαρμογή σε στενή, κατακόρυφη οθόνη χωρίς αλλαγή στη λογική των παιχνιδιών */
html{box-sizing:border-box;-webkit-text-size-adjust:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:inherit}
body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%;height:auto}
input,textarea,select{max-width:100%;font-size:max(16px,1em)}
textarea{resize:vertical}
button,.btn,.action{touch-action:manipulation}
@media(max-width:600px){
 body{margin:0!important}
 .wrap,.shell,.app,main,.main{width:100%!important;max-width:100%!important;margin-left:auto!important;margin-right:auto!important;padding-left:12px!important;padding-right:12px!important}
 .card,.panel,.paper,.write-panel{max-width:100%!important;min-width:0!important}
 h1{font-size:clamp(24px,7vw,32px)!important;line-height:1.2!important;overflow-wrap:anywhere}
 h2{font-size:clamp(20px,5.6vw,26px)!important;overflow-wrap:anywhere}
 h3{font-size:clamp(18px,5vw,22px)!important}
 p,.tip,.instructions,.notice,.rule,.help,.sub,.lead{overflow-wrap:anywhere}
 .actions,.buttons,.top,.head,.hud{flex-wrap:wrap!important}
 button,.btn,.action{min-height:46px;max-width:100%;white-space:normal}
 input,textarea{width:100%;min-width:0;max-width:100%!important}
 .keyboard,.keyboard-picture,.keyboards,.focuskbd,.visual-demo,.keyrow,.kb-row{max-width:100%}
 .keyboard,.keyboard-picture,.keyboards,.focuskbd,.visual-demo{overflow-x:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
 .keyrow,.kb-row{min-width:max-content}
 .key,.kb-key{flex-shrink:0}
 .objects,.capital-guide,.lessons,.guides{max-width:100%;min-width:0}
 .example,.sample,.target,.formula,.model,.mirror,.editor,.typing{max-width:100%;overflow-wrap:anywhere}
}
@media(max-width:380px){
 .wrap,.shell,.app,main,.main{padding-left:9px!important;padding-right:9px!important}
 button,.btn,.action{font-size:clamp(15px,4.5vw,18px)!important}
}
</style></head><body><div class="app"><main id="main"></main><footer class="credit">Δημιουργία: Δέσποινα Καραγιαννίδου</footer></div><script>
"use strict";
const main=document.getElementById("main");let n=0;
const tasks=["Η γάτα κοιμάται.","Το μήλο είναι κόκκινο.","Παίζω με τους φίλους μου.","Ο ήλιος λάμπει.","Γράφω μία όμορφη λέξη."];
function intro(){main.innerHTML=`<section class="card"><div style="font-size:58px">⌨️🌟</div><h1>Ένα και ΜΟΝΟ κενό!</h1><p class="big">Με ποιο πλήκτρο αφήνουμε κενό;</p><div class="keyboards"><div class="keyrow">${"Z X C V B N M , .".split(" ").map(x=>`<span class="key">${x}</span>`).join("")}</div><div class="keyrow"><span class="key">Ctrl</span><span class="key">Alt</span><span class="key space">␣ SPACE / ΚΕΝΟ</span><span class="key">Alt</span><span class="key">Ctrl</span></div></div><p class="label">Το <b>Space (κενό)</b> είναι το <b>μεγάλο μακρόστενο πλήκτρο κάτω στη μέση</b> του πληκτρολογίου.</p><div class="rule">🚨 ΠΡΟΣΟΧΗ!<br>ΜΟΝΟ 1 ΚΕΝΟ<br>ανάμεσα στις λέξεις!</div><div class="example">Η<span class="gap"></span>γάτα <span style="color:#29814a">✓</span></div><p>❌ Όχι δύο κενά! <b class="wrong">Η&nbsp;&nbsp;γάτα</b></p><p class="label">Προσέχουμε επίσης τους <b>ΤΟΝΟΥΣ</b>, τα <b>ΚΕΦΑΛΑΙΑ</b> και την <b>ΤΕΛΕΙΑ</b>!<br>Πατάμε το πλήκτρο του κενού <span class="highlight">ΜΙΑ ΦΟΡΑ</span> και συνεχίζουμε να γράφουμε.</p><p>📱 Σε κινητό ή tablet το πλήκτρο <b>κενό</b> βρίσκεται συνήθως στο κάτω μέρος του πληκτρολογίου οθόνης.</p><button class="btn" id="go">🎮 Παίζω 5 μικρές δοκιμασίες!</button></section>`;document.getElementById("go").onclick=()=>{n=0;game()}}
function game(message=""){let target=tasks[n];main.innerHTML=`<section class="card"><div class="counter">⭐ Δοκιμασία ${n+1} από ${tasks.length}</div><h2>✍️ Αντίγραψε την πρόταση</h2><div class="rule">🚨 ΜΟΝΟ 1 ΚΕΝΟ ανάμεσα στις λέξεις!<div style="font-size:18px">🔠 ΚΕΦΑΛΑΙΑ • ´ ΤΟΝΟΙ • ● ΤΕΛΕΙΑ</div></div><div class="example" id="sample">${target.replaceAll(" ","<span class='gap' aria-label='ένα κενό'></span>")}</div><p class="label">Αντίγραψε ακριβώς: ΤΟΝΟΙ, ΚΕΦΑΛΑΙΟ στην αρχή, ΤΕΛΕΙΑ στο τέλος και ΜΟΝΟ 1 ΚΕΝΟ ανάμεσα στις λέξεις!</p><div id="form"><input class="answer" id="answer" type="text" spellcheck="false" autocomplete="off" aria-label="Αντιγραφή πρότασης" placeholder="Γράψε εδώ την πρόταση..."><p><button class="btn" type="button" id="checkButton">✔ Έλεγχος</button></p></div><div class="msg" id="msg" role="status">${message||"💡 Πάτα το Space μόνο μία φορά ανάμεσα σε δύο λέξεις."}</div><button class="btn secondary" id="back">⌨️ Ξαναβλέπω το πλήκτρο</button></section>`;document.getElementById("checkButton").addEventListener("click",check);document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});document.getElementById("back").onclick=intro}
function check(){
 const value=document.getElementById("answer").value.normalize("NFC"),target=tasks[n].normalize("NFC"),msg=document.getElementById("msg");
 msg.className="msg bad";
 if(!value){msg.textContent="✍️ Γράψε πρώτα την πρόταση και πάτησε Έλεγχος.";return}
 if(/\s{2,}/u.test(value)){msg.textContent="🚨 ΕΧΕΙΣ ΠΟΛΛΑ ΚΕΝΑ! Ανάμεσα στις λέξεις βάζουμε ΜΟΝΟ 1 ΚΕΝΟ. Σβήσε τα επιπλέον κενά με Backspace.";return}
 if(/^\s|\s$/u.test(value)){msg.textContent="🚨 Δεν βάζουμε κενό στην αρχή ή στο τέλος της πρότασης!";return}
 if(value===target){n++;if(n===tasks.length){main.innerHTML=`<section class="card"><div style="font-size:75px">🏆🎉</div><h1>Μπράβο!</h1><p class="big">Έμαθες τον χρυσό κανόνα:</p><div class="rule">ΜΟΝΟ 1 ΚΕΝΟ<br>ανάμεσα στις λέξεις!</div><p>Θυμάσαι και τους τόνους, τα κεφαλαία και την τελεία!</p><button class="btn" id="again">🔄 Παίζω ξανά</button></section>`;document.getElementById("again").onclick=()=>{n=0;game()};return}game("🌟 Μπράβο! Σωστά τα κενά, τα κεφαλαία και οι τόνοι! Προχώρησες στην επόμενη πρόταση.");document.getElementById("msg").className="msg good";return}
 const strip=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC");
 if(value.toLocaleLowerCase("el-GR")===target.toLocaleLowerCase("el-GR")){msg.textContent="🔠 Πρόσεξε το ΚΕΦΑΛΑΙΟ γράμμα στην αρχή της πρότασης!";return}
 if(strip(value)===strip(target)){msg.textContent="´ Πρόσεξε τους ΤΟΝΟΥΣ! Πρέπει να τους βάζουμε σωστά.";return}
 if(value.replace(/[.!;·]$/,"")===target.replace(/[.!;·]$/,"")){msg.textContent="● Πρόσεξε την ΤΕΛΕΙΑ στο τέλος της πρότασης!";return}
 if(value.replace(/\s+/g,"")===target.replace(/\s+/g,"")){msg.textContent="🚨 ΠΡΟΣΟΧΗ ΣΤΑ ΚΕΝΑ! Βάζουμε ακριβώς 1 κενό ανάμεσα σε δύο λέξεις.";return}
 msg.textContent="🔍 Κοίτα ξανά την πρόταση. Έλεγξε γράμματα, ΤΟΝΟΥΣ, ΚΕΦΑΛΑΙΟ, τελεία και ΜΟΝΟ 1 ΚΕΝΟ.";
}

intro();
</script></body></html>
