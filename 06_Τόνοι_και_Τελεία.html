:root{font-family:system-ui,'Segoe UI',sans-serif;color:#302759}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 18% 8%,#ffeab1,transparent 28%),linear-gradient(155deg,#9e84ff,#6a5ec8 58%,#f6a6d5);padding:12px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #ffc52b;outline-offset:3px}.wrap{max-width:930px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;font-weight:900;font-size:clamp(18px,3vw,27px)}.panel{background:#fff9;border:5px solid white;border-radius:30px;box-shadow:0 10px 0 #453b9855,0 20px 40px #35286844;margin:15px 0;padding:clamp(14px,3.5vw,34px);text-align:center}.btn{background:linear-gradient(#ffe577,#ffa73c);border:3px solid #fff3bb;box-shadow:0 6px 0 #ce7936;border-radius:18px;padding:13px 22px;font-weight:1000;min-height:53px;color:#613a28}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #ce7936}.btn.alt{background:linear-gradient(#e4f5ff,#b8d8ff);box-shadow:0 6px 0 #83a7d6;color:#354a7c}.btn:disabled{opacity:.5}.hero{font-size:clamp(65px,16vw,130px);filter:drop-shadow(0 9px #4d419944);animation:float 2s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-9px)}}h1{font-size:clamp(29px,6vw,49px);line-height:1.1;margin:8px 0;color:#6343b7}h2{font-size:clamp(23px,4vw,34px);margin:10px 0;color:#6143ad}.muted{color:#625b80;font-weight:700}.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:left;margin:20px 0}.lesson{background:#f2edff;border:3px solid #d8c7ff;border-radius:20px;padding:15px}.lesson strong{font-size:19px}.key{display:inline-block;background:white;border:2px solid #bdb0de;border-bottom:5px solid #9d8fc5;border-radius:10px;padding:7px 10px;margin:4px 1px;font-weight:1000}.small{font-size:14px}.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-weight:900}.bar{height:16px;flex:1;min-width:80px;border-radius:20px;background:#ddd5ef;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#4dd6a1,#39b4ff);transition:width .3s}.hearts{font-size:23px}.card{background:linear-gradient(145deg,#e8faff,#f5eaff);border:3px solid #c6b3f3;border-radius:24px;padding:18px 10px;margin:16px auto}.prompt{font-weight:1000;color:#6655a3;font-size:clamp(16px,3vw,23px)}.textline{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px;margin:15px auto;max-width:780px}.char{min-width:clamp(24px,5.4vw,45px);min-height:clamp(42px,9vw,62px);border:2px solid #c5b5eb;background:#fff;border-radius:11px;display:inline-flex;justify-content:center;align-items:center;font-size:clamp(22px,4.8vw,36px);font-weight:900;color:#4e3b83;padding:3px}.char.pick{background:linear-gradient(#fff6ba,#ffd47e);border-color:#dca74c;box-shadow:0 4px 0 #ce984d}.char.good{background:#b8f3d7;border-color:#48ba88}.char.space{min-width:12px;border:0;background:transparent}.char.punct{border:0;background:transparent;min-width:14px}.message{font-size:clamp(16px,3.2vw,21px);font-weight:900;min-height:56px;color:#5746a4;margin:13px 0}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.input{display:block;width:min(650px,100%);margin:16px auto;padding:14px;border:4px solid #c9b8f3;border-radius:18px;font-size:clamp(19px,4vw,28px);text-align:center;color:#32245b;background:white}.input:focus{border-color:#785bd8}.sample{font-size:clamp(21px,4.4vw,31px);font-weight:900;line-height:1.5;color:#49358b;overflow-wrap:anywhere}.highlight{background:#ffed94;border-radius:5px;padding:0 2px}.credit{color:#fff;text-align:center;font-weight:800;font-size:13px;padding:9px}.confetti{position:fixed;top:-40px;pointer-events:none;animation:fall linear forwards;z-index:30}@keyframes fall{to{transform:translateY(115vh) rotate(740deg)}}@media(max-width:600px){.lessons{grid-template-columns:1fr}.panel{border-radius:22px}.actions .btn{flex:1;min-width:130px}.char{min-width:24px}.top{font-size:17px}}
</style><style id="portrait-mobile-support">

*,*::before,*::after{box-sizing:inherit}
body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%;height:auto}
input,textarea,select{max-width:100%;font-size:max(16px,1em)}
textarea{resize:vertical}
button,.btn,.action{touch-action:manipulation}

 .keyboard,.keyboard-picture,.keyboards,.focuskbd,.visual-demo{overflow-x:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
 .keyrow,.kb-row{min-width:max-content}
 .key,.kb-key{flex-shrink:0}
 .objects,.capital-guide,.lessons,.guides{max-width:100%;min-width:0}

}

</style></head><body><div class="wrap"><header class="top"><div>🏰 Το Κάστρο των Τόνων</div><button id="sound" class="btn alt" aria-label="Εναλλαγή ήχου">🔊</button></header><main class="panel" id="game" aria-live="polite"></main><footer class="credit">Δημιουργία: Δέσποινα Καραγιαννίδου</footer></div><script>
'use strict';
/* ΑΛΛΑΞΤΕ ΕΔΩ ΤΟ ΠΕΡΙΕΧΟΜΕΝΟ. Πρώτα οι λέξεις, μετά οι προτάσεις. */
const CONFIG={lives:3,words:[['γάτα','Νιαουρίζει!'],['μήλο','Ένα φρούτο.'],['νερό','Το πίνουμε.'],['οθόνη','Μας δείχνει εικόνες.'],['ποντίκι','Κινεί τον δείκτη.'],['πληκτρολόγιο','Με αυτό γράφουμε.'],['υπολογιστής','Τον χρησιμοποιούμε στην Πληροφορική.'],['βιβλίο','Έχει σελίδες.']],sentences:['Η Άννα γράφει στον υπολογιστή.','Ο Νίκος παίζει ένα παιχνίδι.','Η Μαρία ζωγραφίζει ένα σπίτι.','Το ποντίκι κινεί τον δείκτη.','Η οθόνη δείχνει όμορφες εικόνες.','Σήμερα μαθαίνουμε στην τάξη.']};
const $=id=>document.getElementById(id);let stage='intro',wordIndex=0,sentenceIndex=0,lives=CONFIG.lives,muted=false,audio=null,busy=false;const vowels='αεηιουωΑΕΗΙΟΥΩ';
const plain=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').normalize('NFC');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function beep(kind){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=kind==='bad'?'triangle':'sine';o.frequency.setValueAtTime(kind==='bad'?220:450,audio.currentTime);o.frequency.linearRampToValueAtTime(kind==='bad'?150:kind==='win'?880:690,audio.currentTime+.17);g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.23);o.start();o.stop(audio.currentTime+.24)}catch(e){}}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};
function fireworks(){for(let i=0;i<75;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['✨','🌟','💜','🎉','💎'][i%5];e.style.left=Math.random()*100+'vw';e.style.fontSize=(12+Math.random()*19)+'px';e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.8+'s';document.body.append(e);setTimeout(()=>e.remove(),5100)}}
function intro(){stage='intro';$('game').innerHTML=`<div class="hero">🏰✨</div><h1>Το Κάστρο των Τόνων</h1><p class="muted">Πριν παίξουμε, θυμόμαστε πώς γράφουμε τόνο στο πληκτρολόγιο!</p><div class="lessons"><section class="lesson"><strong>🔡 Τόνος σε μικρό γράμμα</strong><p>Πατάω πρώτα το πλήκτρο του τόνου και μετά το φωνήεν.</p><div><span class="key">;  ´</span> ➜ <span class="key">α</span> ➜ <span class="key">ά</span></div><p class="small"><b>Θυμήσου:</b> Το πλήκτρο του τόνου <b>;</b> βρίσκεται <b>δίπλα στο Λ</b> στο ελληνικό πληκτρολόγιο!</p></section><section class="lesson"><strong>🔠 Τόνος σε ΚΕΦΑΛΑΙΟ</strong><p>Πατάω πρώτα τον τόνο και μετά κρατάω <b>Shift</b> μαζί με το φωνήεν.</p><div><span class="key">;  ´</span> ➜ <span class="key">⇧ Shift + Α</span> ➜ <span class="key">Ά</span></div><p class="small">Στο κινητό/tablet κρατάω πατημένο το φωνήεν και διαλέγω το τονισμένο. Για κεφαλαίο, ενεργοποιώ πρώτα το ⇧.</p></section><section class="lesson"><strong>🔴 Πού είναι η τελεία;</strong><p>Η τελεία <b>.</b> βρίσκεται <b>κάτω δεξιά στο πληκτρολόγιο, δίπλα στο κόμμα (,)</b>. Το <b>κόμμα είναι δίπλα στο Μ</b>.</p><div><span class="key">Μ</span> ➜ <span class="key">,</span> ➜ <span class="key">.</span></div><p class="small">Στο τέλος κάθε πρότασης βάζω τελεία. Στο κινητό πατάω <b>?123</b> για να βρω τα σημεία στίξης, αν δεν φαίνονται.</p></section></div><p class="muted">🎯 Πρώτα πληκτρολογούμε λέξεις με τόνους και μετά ολόκληρες προτάσεις!</p><button class="btn" id="begin">🪄 Ξεκινάω το παιχνίδι!</button>`;$('begin').onclick=()=>{wordIndex=0;sentenceIndex=0;lives=CONFIG.lives;showWord()}}
function hud(label,done,total){return `<div class="hud"><span>${label}</span><div class="bar"><div style="width:${done/total*100}%"></div></div><span class="hearts">${'❤️'.repeat(lives)}${'🤍'.repeat(CONFIG.lives-lives)}</span></div>`}
function fail(msg){beep('bad');lives--;const h=$('hearts');if(h)h.textContent='❤️'.repeat(lives)+'🤍'.repeat(CONFIG.lives-lives);$('msg').textContent=msg;if(lives===0){busy=true;setTimeout(()=>gameOver(),850)}}
function gameOver(){stage='lost';$('game').innerHTML=`<div class="hero">💜</div><h1>Μπορείς να τα καταφέρεις!</h1><p class="muted">Δεν πειράζει! Οι μάγοι εξασκούνται και ξαναδοκιμάζουν.</p><button class="btn" id="retry">🔄 Παίζω ξανά αυτό το μέρος</button>`;$('retry').onclick=()=>{lives=CONFIG.lives;busy=false;if(wordIndex<CONFIG.words.length)showWord();else showSentence()}}
function targetPositions(text){const chars=[...text];return chars.map((c,i)=>plain(c)!==c?i:-1).filter(i=>i>=0)}
// Οι λέξεις πληκτρολογούνται, όπως και οι προτάσεις. Δεν επιλέγουμε φωνήεν.
function showWord(){
 stage='words';busy=false;
 if(wordIndex>=CONFIG.words.length){lives=CONFIG.lives;showSentence();return}
 const [word,clue]=CONFIG.words[wordIndex];
 $('game').innerHTML=`${hud('⌨️ Λέξεις '+(wordIndex+1)+'/'+CONFIG.words.length,wordIndex,CONFIG.words.length)}
 <div class="card"><div class="prompt">✍️ Γράψε τη λέξη με τον σωστό τόνο!</div>
 <p class="muted">💡 ${esc(clue)}</p><div class="sample">${esc(plain(word))}</div>
 <input id="answer" class="input" type="text" lang="el" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Γράψε εδώ τη λέξη…" aria-label="Γράψε τη λέξη με τόνο">
 <div class="message" id="msg">⌨️ Πάτα πρώτα τον τόνο (δίπλα στο Λ) και μετά το φωνήεν.</div></div>
 <div class="actions"><button class="btn" id="check">✨ Έλεγχος</button><button class="btn alt" id="help">💡 Βοήθεια</button></div>`;
 const h=$('game').querySelector('.hearts');if(h)h.id='hearts';
 $('check').onclick=()=>checkWord(word);
 $('answer').onkeydown=e=>{if(e.key==='Enter')checkWord(word)};
 $('help').onclick=()=>{$('msg').textContent='💡 Ο τόνος μπαίνει στο '+[...word].filter(c=>plain(c)!==c).join(' και στο ')+'. Στο πληκτρολόγιο το πλήκτρο τόνου είναι δίπλα στο Λ.'};
}
function checkWord(word){
 if(busy)return;
 const given=$('answer').value.trim().normalize('NFC');
 if(given===word.normalize('NFC')){
  busy=true;beep('good');$('msg').textContent='🌟 Μπράβο! Έγραψες σωστά: '+word;
  $('answer').disabled=true;$('check').disabled=true;
  setTimeout(()=>{wordIndex++;showWord()},1050);
 }else if(plain(given).toLocaleLowerCase('el')===plain(word).toLocaleLowerCase('el')){
  fail('💜 Πολύ κοντά! Πρόσεξε τον τόνο και ξαναγράψε τη λέξη.');
 }else{fail('💜 Κοίτα τα γράμματα και πρόσθεσε τον τόνο στη σωστή θέση!')}
}
function showSentence(){stage='sentences';busy=false;if(sentenceIndex>=CONFIG.sentences.length){victory();return}const target=CONFIG.sentences[sentenceIndex],raw=plain(target);$('game').innerHTML=`${hud('✍️ Προτάσεις '+(sentenceIndex+1)+'/'+CONFIG.sentences.length,sentenceIndex,CONFIG.sentences.length)}<div class="card"><div class="prompt">Βάλε τους τόνους στην πρόταση!</div><p class="muted">Γράψε την πρόταση με τόνους, κεφαλαίο και τελεία (κάτω δεξιά, δίπλα στο κόμμα, που είναι δίπλα στο Μ).</p><div class="sample">${esc(raw)}</div><input id="answer" class="input" type="text" lang="el" spellcheck="false" autocomplete="off" autocapitalize="sentences" placeholder="Γράψε εδώ την πρόταση…" aria-label="Γράψε την πρόταση με τόνους"><div class="message" id="msg">⌨️ Τόνος: δίπλα στο Λ. Τελεία: δίπλα στο κόμμα (,). Το κόμμα είναι δίπλα στο Μ!</div></div><div class="actions"><button class="btn" id="check">✨ Έλεγχος</button><button class="btn alt" id="help">💡 Βοήθεια</button></div>`;const h=$('game').querySelector('.hearts');if(h)h.id='hearts';$('check').onclick=()=>checkSentence(target);$('answer').onkeydown=e=>{if(e.key==='Enter')checkSentence(target)};$('help').onclick=()=>{const marks=[...target].filter(c=>plain(c)!==c);$('msg').textContent='💡 Οι τονισμένες φωνές είναι: '+marks.join(' • ')+' .'}}
function checkSentence(target){if(busy)return;const given=$('answer').value.trim().normalize('NFC'),expected=target.normalize('NFC');if(given===expected){busy=true;beep('good');$('msg').textContent='🌟 Τέλεια! Έγραψες όλους τους τόνους σωστά!';$('answer').disabled=true;$('check').disabled=true;setTimeout(()=>{sentenceIndex++;showSentence()},1100)}else if(plain(given).toLocaleLowerCase('el')===plain(expected).toLocaleLowerCase('el')){fail('💜 Πρόσεξε τους τόνους, το κεφαλαίο και την τελεία (δίπλα στο κόμμα, που είναι δίπλα στο Μ)!')}else{fail('💜 Κοίτα προσεκτικά τα γράμματα της πρότασης και δοκίμασε ξανά!')}}
function victory(){stage='won';beep('win');fireworks();$('game').innerHTML=`<div class="hero">🏆👑✨</div><h1>Μάγος των Τόνων!</h1><h2>Τα κατάφερες!</h2><p class="muted">Έβαλες τόνους σε ${CONFIG.words.length} λέξεις και έγραψες ${CONFIG.sentences.length} προτάσεις!</p><p>🌈 Το κάστρο φωτίστηκε!</p><button class="btn" id="again">🎮 Παίζω ξανά</button>`;$('again').onclick=intro}
intro();
</script></body></html>
