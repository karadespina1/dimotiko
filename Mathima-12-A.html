<style>

olor:#ffffff69}.bar{height:52px;display:flex;gap:8px;align-items:center;padding:4px 8px;background:#181b42;color:white;z-index:3}.bar button,.menu button{background:#363363;color:white;padding:0 12px}.menu{position:absolute;z-index:4;bottom:58px;left:8px;background:#fff;color:#222840;border:1px solid #d7dbee;border-radius:12px;padding:10px;width:min(240px,calc(100% - 16px));box-shadow:0 6px 24px #080d3255}.menu b{display:block;margin:0 0 6px}.menu button{width:100%;text-align:left}.menu button+button{margin-top:6px}.center{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:18px}.center strong{font-size:1.25rem}.center p{color:#cbd2e6}.loader{width:35px;height:35px;border:4px solid #615a91;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.power{min-width:48px;color:white;background:#3a4264;font-size:1.4rem}.bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.bottom button{padding:0 13px;background:white;color:#352775;border:1px solid #cbd2ea}.bottom button:disabled{opacity:.5;cursor:default}.bottom .again{background:#5544b8;color:white}.paint{position:absolute;z-index:2;inset:9px 12px 61px clamp(8px,15%,145px);display:flex;flex-direction:column;overflow:hidden;background:#e7e8fa;color:#26224a;border:1px solid #aaa5d7;border-radius:13px;box-shadow:0 10px 28px #16143166}.title{display:flex;justify-content:space-between;align-items:center;background:#f8f7ff;padding-left:12px;font-weight:800}.close{color:#90233e;background:#fae1eb;width:52px;font-size:1.65rem;border-radius:0}.close:hover{background:#ac2445;color:white}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:5px 7px}.tools button{background:#fff;color:#282249;padding:0 8px;font-size:.86rem}.tools button[aria-pressed=true]{background:#d6ccff;box-shadow:inset 0 0 0 2px #5e469a}.tools .color{width:32px;min-height:40px;background:var(- <body>
<main>
<div class="subject">ΠΛΗΡΟΦΟΡΙΚΗ Α΄ ΔΗΜΟΤΙΚΟΥ · ΜΑΘΗΜΑ 12</div>
<h1>Ο πρώτος μου υπολογιστής</h1>
<ol class="steps" aria-label="Βήματα άσκησης"><li>1. Εκκίνηση</li><li>2. Άνοιγμα</li><li>3. Κλείσιμο</li><li>4. Τερματισμός</li></ol>
<section class="guide" aria-live="polite"><h2 id="instruction"></h2><p id="hint"></p></section>
<section class="machine" aria-label="Προσομοίωση υπολογιστή">
<div class="hardware-scene">
<div class="tower" role="group" aria-label="Κεντρική μονάδα">
<button type="button" class="power" id="power" aria-label="Κουμπί λειτουργίας κεντρικής μονάδας">⏻</button>
<span class="power-label" aria-hidden="true">Κουμπί<br>εκκίνησης</span>
<span id="lamp" class="lamp" aria-hidden="true"></span>
<div class="drive" aria-hidden="true"></div>
<div class="ports" aria-hidden="true"><i></i><i></i></div>
</div>
<div class="monitor">
<div class="bezel" id="bezel">
<div class="screen">
<div class="center" id="status"></div>
<div class="desktop" id="desktop" hidden>
<button type="button" class="shortcut" id="shortcut" aria-pressed="false"><span aria-hidden="true">🎨</span><span>Ζωγραφική<br>(MS Paint)</span></button>
<section class="paint" id="paint" aria-label="Παράθυρο Ζωγραφικής" hidden>
<div class="title"><span>Ζωγραφική · Χωρίς τίτλο</span><button class="close" id="close" aria-label="Κλείσιμο Ζωγραφικής">×</button></div>
<div class="tools" aria-label="Εργαλεία ζωγραφικής">
<button id="brush" aria-pressed="true">Πινέλο</button><button id="eraser" aria-pressed="false">Γόμα</button>
<button class="color" style="--ink:#302360" data-ink="#302360" aria-label="Σκούρο μοβ" aria-pressed="true"></button>
<button class="color" style="--ink:#d73558" data-ink="#d73558" aria-label="Κόκκινο" aria-pressed="false"></button>
<button class="color" style="--ink:#1468e7" data-ink="#1468e7" aria-label="Μπλε" aria-pressed="false"></button>
<button class="color" style="--ink:#14844e" data-ink="#14844e" aria-label="Πράσινο" aria-pressed="false"></button>
</div>
<div class="canvas-area"><canvas id="paper" width="1200" height="650" aria-label="Καμβάς ζωγραφικής"></canvas></div>
</section>
<div class="bar">
<button id="start" aria-expanded="false" aria-controls="menu"><span class="start-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Έναρξη</button>
<time class="clock" id="clock"></time>
</div>
<section class="menu" id="menu" aria-label="Μενού Έναρξη" hidden>
<div class="menu-head"><label for="app-search">Αναζήτηση εφαρμογής</label><input id="app-search" type="search" placeholder="Πληκτρολόγησε εδώ" autocomplete="off"></div>
<div class="menu-apps"><h2>Εφαρμογές</h2><button type="button" id="menu-paint"><span class="app-icon" aria-hidden="true">🎨</span> Ζωγραφική (MS Paint)</button><p id="search-empty" hidden>Δεν βρέθηκε εφαρμογή.</p></div>
<div class="menu-footer">
<button type="button" id="energy" aria-expanded="false" aria-controls="power-options"><span aria-hidden="true">⏻</span> Λειτουργία</button>
<div class="power-options" id="power-options" hidden>
<button type="button" id="sleep"><span aria-hidden="true">☾</span> Αναστολή λειτουργίας</button>
<button type="button" id="shutdown"><span aria-hidden="true">⏻</span> Τερματισμός λειτουργίας</button>

</section>
</div>
<div id="save" class="save-overlay" hidden>

<div class="save-actions">
<button type="button" id="save-yes">Αποθήκευση</button>
<button type="button" id="save-no">Κλείσιμο χωρίς αποθήκευση</button>

</div>

<script>
const byId = id => document.getElementById(id);
const shortcut = byId('shortcut'), desktop = byId('desktop'), paint = byId('paint');
const power = byId('power'), start = byId('start'), energy = byId('energy');
const menu = byId('menu'), shutdown = byId('shutdown'), enter = byId('enter');
const powerOptions = byId('power-options'), search = byId('app-search');
const menuPaint = byId('menu-paint'), clock = byId('clock');
let beforeSleep;
function updateClock() {
  clock.textContent = new Intl.DateTimeFormat('el-GR',{hour:'2-digit',minute:'2-digit'}).format(new Date());
}
updateClock();
setInterval(updateClock,30000);
const save = byId('save'), paper = byId('paper'), statusPanel = byId('status');
const ctx = paper.getContext('2d');
const steps = [...document.querySelectorAll('.steps li')];
const colors = [...document.querySelectorAll('[data-ink]')];
const used = new Set();
let state = 'off', selected = false, dirty = false, pointer = null;
let lastTap = -Infinity, ink = colors[0].dataset.ink, erasing = false;
const messages = {
  off:['Άνοιξε τον υπολογιστή','Πάτησε το κουμπί λειτουργίας ⏻ στην κεντρική μονάδα δίπλα στην οθόνη.'],
  boot:['Ο υπολογιστής ξεκινά','Περίμενε να εμφανιστεί η επιφάνεια εργασίας.'],
  opening:['Άνοιξε τη Ζωγραφική','Κάνε διπλό κλικ στο εικονίδιο ή κάνε ένα κλικ και πάτησε Enter. Στην αφή, πάτησε δύο φορές γρήγορα ή μία φορά και μετά το κουμπί Enter.'],
  drawing:['Ζωγράφισε και κλείσε το παράθυρο','Διάλεξε χρώμα και σύρε πάνω στο χαρτί. Όταν τελειώσεις, πάτησε το × πάνω δεξιά.'],
  closing:['Αποθήκευση ζωγραφιάς','Διάλεξε αν θέλεις να κρατήσεις τη ζωγραφιά σου.'],
  ready:['Τερμάτισε τον υπολογιστή','Πάτησε Έναρξη, μετά Λειτουργία και τέλος Τερματισμός λειτουργίας.'],
  sleeping:['Ο υπολογιστής είναι σε αναστολή','Πάτησε το κουμπί ⏻ για να συνεχίσεις από εκεί που έμεινες.'],
  restarting:['Ο υπολογιστής επανεκκινείται','Περίμενε να εμφανιστεί ξανά η επιφάνεια εργασίας.'],
  stopping:['Ο υπολογιστής τερματίζει','Περίμενε να σβήσει η οθόνη.'],
  done:['Ολοκλήρωσες το μάθημα!', 'Πάτησε «Παίζω ξανά» για νέα προσπάθεια.']
};
function show(next) {
  state = next;
  const [title, hint] = messages[next];
  byId('instruction').textContent = title;
  byId('hint').textContent = next === 'done' && used.size === 1
    ? (used.has('double') ? 'Παίξε ξανά και άνοιξε τη Ζωγραφική με ένα κλικ και Enter.' : 'Παίξε ξανά και άνοιξε τη Ζωγραφική με διπλό κλικ ή δύο γρήγορα αγγίγματα.') : hint;
  desktop.hidden = !['opening','drawing','closing','ready'].includes(next);
  statusPanel.hidden = !desktop.hidden;
  paint.hidden = !['drawing','closing'].includes(next);
  shortcut.inert = !paint.hidden;
  save.hidden = next !== 'closing';
  desktop.inert = !save.hidden;
  power.inert = !save.hidden;
  const powered = !['off','done'].includes(next);
  byId('lamp').classList.toggle('on', powered);
  byId('bezel').classList.toggle('on', powered);
  power.setAttribute('aria-disabled', String(!['off','sleeping'].includes(next)));
  byId('again').hidden = next !== 'done';
  statusPanel.innerHTML = ({
    off:'<strong>Η οθόνη είναι σβηστή</strong>',
    boot:'<span class="loader" aria-hidden="true"></span><strong>Εκκίνηση…</strong>',
    sleeping:'<strong>Αναστολή λειτουργίας</strong>',
    restarting:'<span class="loader" aria-hidden="true"></span><strong>Επανεκκίνηση…</strong>',
    stopping:'<span class="loader" aria-hidden="true"></span><strong>Τερματισμός λειτουργίας…</strong>',
    done:'<strong class="complete">✓ Ο υπολογιστής έκλεισε</strong>'
  })[next] ?? '';
  const current = ({off:0,boot:0,opening:1,drawing:2,closing:2,ready:3,sleeping:beforeSleep === 'ready' ? 3 : 1,restarting:0,stopping:3,done:4})[next];
  steps.forEach((step, index) => {
    step.classList.toggle('done', index < current);
    if (index === current) step.setAttribute('aria-current','step');
    else step.removeAttribute('aria-current');
  });
}
function select(value) {
  selected = value;
  shortcut.setAttribute('aria-pressed', String(value));
  enter.disabled = !value;
}
function hideMenu() {
  menu.hidden = true;
  powerOptions.hidden = true;
  start.setAttribute('aria-expanded','false');
  energy.setAttribute('aria-expanded','false');
}
function openPaint(method) {
  if ((method !== 'menu' && !selected) || !['opening','ready'].includes(state)) return;
  if (method !== 'menu') used.add(method);
  select(false);
  hideMenu();
  ctx.clearRect(0,0,paper.width,paper.height);
  dirty = false;
  show('drawing');
  byId('close').focus();
}
power.onclick = () => {
  if (state === 'sleeping') {
    show(beforeSleep);
    start.focus();
    return;
  }
  if (state !== 'off') return;
  show('boot');
  setTimeout(() => { show('opening'); shortcut.focus(); }, 1100);
};
shortcut.addEventListener('pointerup', event => {
  if (event.pointerType === 'mouse') return;
  const now = performance.now();
  if (selected && now - lastTap < 430) openPaint('double');
  lastTap = now;
});
shortcut.onclick = () => {
  if (!['opening','ready'].includes(state)) return;
  hideMenu();
  select(true);
};
shortcut.ondblclick = () => openPaint('double');
shortcut.onkeydown = event => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  openPaint('enter');
};
enter.onclick = () => openPaint('enter');
desktop.addEventListener('click', event => {
  if (event.target === desktop) { select(false); hideMenu(); }
});
start.onclick = () => {
  const opening = menu.hidden;
  hideMenu();
  select(false);
  if (opening) {
    menu.hidden = false;
    start.setAttribute('aria-expanded','true');
    search.value = '';
    filterApps();
    menuPaint.focus();
  }
};
function filterApps() {
  const normalize = value => value.toLocaleLowerCase('el-GR').normalize('NFD').replace(/\p{M}/gu,'');
  const query = normalize(search.value.trim());
  menuPaint.hidden = !normalize('Ζωγραφική Microsoft MS Paint mspaint').includes(query);
  byId('search-empty').hidden = !menuPaint.hidden;
}
search.oninput = filterApps;
search.onkeydown = event => {
  if (event.key === 'Enter' && !menuPaint.hidden) menuPaint.click();
};
menuPaint.onclick = () => {
  if (state === 'drawing') {
    hideMenu();
    byId('close').focus();
  } else openPaint('menu');
};
energy.onclick = () => {
  powerOptions.hidden = !powerOptions.hidden;
  energy.setAttribute('aria-expanded',String(!powerOptions.hidden));
  if (!powerOptions.hidden) byId('sleep').focus();
};
function closeBeforePowerAction() {
  if (state !== 'drawing') return true;
  hideMenu();
  byId('hint').textContent = 'Κλείσε πρώτα τη Ζωγραφική με το × πάνω δεξιά.';
  byId('close').focus();
  return false;
}
byId('sleep').onclick = () => {
  if (!closeBeforePowerAction()) return;
  beforeSleep = state;
  hideMenu();
  show('sleeping');
  power.focus();
};
byId('restart').onclick = () => {
  if (!closeBeforePowerAction()) return;
  hideMenu();
  show('restarting');
  setTimeout(() => { show('opening'); shortcut.focus(); }, 1100);
};
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || menu.hidden || !save.hidden) return;
  if (!powerOptions.hidden) {
    powerOptions.hidden = true;
    energy.setAttribute('aria-expanded','false');
    energy.focus();
  } else {
    hideMenu();
    start.focus();
  }
});
shutdown.onclick = () => {
  if (!closeBeforePowerAction()) return;
  if (state !== 'ready') {
    hideMenu();
    byId('hint').textContent = 'Πρώτα άνοιξε τη Ζωγραφική και κλείσε το παράθυρό της με το ×.';
    shortcut.focus();
    return;
  }
  hideMenu();
  select(false);
  show('stopping');
  setTimeout(() => { show('done'); byId('again').focus(); }, 1100);
};
function closePaint() {
  pointer = null;
  show('ready');
  start.focus();
}
byId('close').onclick = () => {
  if (!dirty) { closePaint(); return; }
  hideMenu();
  show('closing');
  byId('save-no').focus();
};
byId('save-no').onclick = closePaint;
byId('save-cancel').onclick = () => {
  show('drawing');
  byId('close').focus();
};
save.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    event.preventDefault();
    byId('save-cancel').click();
  }
});
byId('save-yes').onclick = () => {
  try {
    const output = document.createElement('canvas');
    output.width = paper.width;
    output.height = paper.height;
    const outputCtx = output.getContext('2d');
    outputCtx.fillStyle = '#fff';
    outputCtx.fillRect(0,0,output.width,output.height);
    outputCtx.drawImage(paper,0,0);
    const link = document.createElement('a');
    link.download = 'Zografia.png';
    link.href = output.toDataURL('image/png');
    link.click();
  } finally {
    closePaint();
  }
};
function choose(nextInk, erase) {
  ink = nextInk;
  erasing = erase;
  byId('brush').setAttribute('aria-pressed', String(!erase));
  byId('eraser').setAttribute('aria-pressed', String(erase));
  colors.forEach(button => button.setAttribute('aria-pressed', String(!erase && button.dataset.ink === ink)));
}
byId('brush').onclick = () => choose(ink, false);
byId('eraser').onclick = () => choose(ink, true);
colors.forEach(button => button.onclick = () => choose(button.dataset.ink, false));
function point(event) {
  const bounds = paper.getBoundingClientRect();
  return [(event.clientX-bounds.left)*paper.width/bounds.width, (event.clientY-bounds.top)*paper.height/bounds.height];
}
function draw(from, to) {
  ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ink;
  ctx.lineWidth = erasing ? 38 : 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(...from);
  ctx.lineTo(...to);
  ctx.stroke();
  dirty = true;
}
paper.onpointerdown = event => {
  if (pointer || event.button !== 0) return;
  const from = point(event);
  pointer = { id:event.pointerId, from };
  paper.setPointerCapture(event.pointerId);
  draw(from,[from[0]+.01,from[1]]);
};
paper.onpointermove = event => {
  if (pointer?.id !== event.pointerId) return;
  const to = point(event);
  draw(pointer.from,to);
  pointer.from = to;
};
for (const type of ['pointerup','pointercancel','lostpointercapture']) {
  paper.addEventListener(type,event => { if (pointer?.id === event.pointerId) pointer = null; });
}
byId('again').onclick = () => {
  lastTap = -Infinity;
  choose(colors[0].dataset.ink, false);
  show('off');
  power.focus();
};
show('off');
</script>
</body>
