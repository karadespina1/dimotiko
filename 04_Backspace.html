<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ο Μαγικός Σβηστήρας — Backspace</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:linear-gradient(135deg,#b5efff,#d8c5ff 55%,#ffe0ed);color:#29305c;padding:12px;min-height:100vh}.wrap{max-width:880px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:12px 16px;font-weight:900}.card{margin:15px auto;background:#fffefa;border:4px solid white;border-radius:27px;padding:clamp(15px,3vw,30px);box-shadow:0 9px 0 #7864b94a;text-align:center}h1{font-size:clamp(27px,5.5vw,43px);color:#6844bd;margin:8px 0}h2{color:#6948bd;font-size:clamp(22px,4.2vw,32px)}p{line-height:1.55}.hero{font-size:65px}.btn{border:0;border-bottom:5px solid #d68431;border-radius:17px;background:linear-gradient(#ffe783,#ffb54c);padding:14px 21px;font-size:clamp(17px,3vw,22px);font-weight:950;color:#754013;cursor:pointer;min-height:55px}.btn:active{transform:translateY(3px);border-bottom-width:2px}.secondary{background:#e8e0ff;border:2px solid #c6b6f6;border-bottom:5px solid #a48ce3;color:#56369d}.guide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;text-align:left}.tip{background:#eef8ff;border:3px solid #d4eafa;border-radius:19px;padding:14px}.tip:nth-child(even){background:#fff0f7;border-color:#ffd5e8}.key{display:inline-flex;align-items:center;justify-content:center;background:white;border:2px solid #c4b8d9;border-bottom:5px solid #a99abf;border-radius:9px;min-height:39px;padding:5px 10px;font-weight:900}.keyboard{background:#d9e0ef;padding:11px;border-radius:18px;border:3px solid #bac4db;margin:12px auto;max-width:600px}.keyrow{display:flex;justify-content:center;gap:5px;margin:5px 0}.keyrow .key{font-size:clamp(11px,2.3vw,16px);flex:1;min-width:0;padding:6px 1px}.keyrow .backkey{flex:2.6;background:#ffe16c;border-color:#f5b647;box-shadow:0 0 0 3px #ffb4315e;color:#6d430c}.note{background:#fff6d9;border-radius:15px;padding:12px;margin:14px 0;font-size:16px}.bar{height:16px;background:#e9e1f7;border-radius:20px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;background:linear-gradient(90deg,#6ad9fd,#a185ff,#f985c1);transition:width .25s}.status{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;font-weight:850}.pill{background:#eee9ff;padding:8px 13px;border-radius:20px}.goal{font-size:clamp(26px,5.3vw,41px);font-weight:950;color:#5132a3}.editbox{margin:18px auto 9px;max-width:680px;background:#f6f1ff;border:4px solid #b9a5f7;border-radius:20px;padding:17px 8px;overflow-x:auto}.chars{display:flex;align-items:stretch;justify-content:center;min-height:75px;min-width:max-content;user-select:none}.char{position:relative;display:flex;align-items:center;justify-content:center;min-width:clamp(31px,6.8vw,55px);height:69px;font-size:clamp(29px,6vw,45px);font-weight:900;border-radius:11px;cursor:pointer;touch-action:manipulation}.char.bad{background:#ffe071;color:#8a3608;box-shadow:inset 0 -5px #ff9b56;animation:shine 1s ease-in-out infinite alternate}.char.bad:after{content:"✦";font-size:15px;position:absolute;right:1px;top:0;color:#e34e3e}@keyframes shine{to{background:#ffba9b}}.char:focus-visible{outline:3px solid #7a52e3}.caret{height:61px;width:4px;background:#4132aa;border-radius:3px;align-self:center;flex:none;animation:blink .9s steps(1) infinite}@keyframes blink{50%{opacity:0}}.caret.edge{margin-left:0}.instructions{font-size:clamp(16px,3vw,20px);font-weight:800}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0}.controls button{min-width:85px}.message{min-height:60px;border-radius:16px;padding:13px;background:#edf4ff;color:#354c80;font-weight:850;margin:12px 0}.message.good{background:#ddffe9;color:#246c43}.message.warn{background:#fff0dc;color:#93531b}.credit{text-align:center;font-size:13px;font-weight:800;color:#52407b;margin:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.hintarrow{color:#d95525;font-weight:950}.small{font-size:14px;color:#68627b}.stars{font-size:30px}.focuskbd{position:fixed;left:-9999px;opacity:0;width:1px;height:1px}@media(max-width:590px){.guide{grid-template-columns:1fr}.card{padding:15px 10px}.char{min-width:clamp(27px,7vw,38px);height:57px}.caret{height:50px}.controls button{flex:1;min-width:0}.head{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><style id="responsive-mobile-tablet-desktop">
html{box-sizing:border-box;-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:inherit}
body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%;height:auto}
input,textarea,select{max-width:100%;font-size:max(16px,1em)}
textarea{resize:vertical}
button,.btn,.action{touch-action:manipulation}
@media(max-width:850px){
.wrap,.shell,.app,main,.main{max-width:100%!important;width:100%!important;margin-inline:auto!important;padding-inline:clamp(10px,2.8vw,24px)!important}
.card,.panel,.paper,.write-panel,.hero,.instructions{max-width:100%;min-width:0}
.actions,.buttons,.top,.head,.hud{flex-wrap:wrap!important}
.keyboard,.keyboard-picture,.keyboards,.focuskbd,.visual-demo{max-width:100%;overflow-x:auto!important;-webkit-overflow-scrolling:touch}
.keyrow,.kb-row{min-width:max-content}
.key,.kb-key{flex-shrink:0}
input,textarea{width:100%;min-width:0}
.example,.sample,.target,.formula,.model,.mirror,.editor,.typing,.help{max-width:100%;overflow-wrap:anywhere}
}
@media(max-width:600px){
body{margin:0!important}
h1{font-size:clamp(23px,6.7vw,32px)!important;line-height:1.2!important;overflow-wrap:anywhere}
h2{font-size:clamp(20px,5.5vw,26px)!important;overflow-wrap:anywhere}
h3{font-size:clamp(18px,5vw,22px)!important}
button,.btn,.action{min-height:46px;max-width:100%;white-space:normal}
p,.tip,.instructions,.notice,.rule,.help,.sub,.lead{overflow-wrap:anywhere}
}
@media(max-width:380px){
.wrap,.shell,.app,main,.main{padding-inline:9px!important}
button,.btn,.action{font-size:clamp(15px,4.4vw,18px)!important}
}
</style></head><body><div class="wrap"><header class="head"><span>🪄 Ο Μαγικός Σβηστήρας</span><button id="sound" class="btn secondary" style="min-height:40px;padding:6px 10px;font-size:14px">🔊 Ήχος</button></header><main id="app"></main><footer class="credit">Δημιουργία: Δέσποινα Καραγιαννίδου</footer></div><input id="physical" class="focuskbd" type="text" autocomplete="off" aria-label="Πληκτρολόγιο για το παιχνίδι"><script>
"use strict";
const app=document.getElementById("app"),physical=document.getElementById("physical"),soundBtn=document.getElementById("sound");
let sound=true,context=null,level=0,word="",caret=0,done=false;
const puzzles=[
{wrong:"μήλλο",right:"μήλο",extra:2},
{wrong:"γάττα",right:"γάτα",extra:3},
{wrong:"νερρό",right:"νερό",extra:3},
{wrong:"σπίττι",right:"σπίτι",extra:4},
{wrong:"καρρδιά",right:"καρδιά",extra:3},
{wrong:"ποδδήλατο",right:"ποδήλατο",extra:3},
{wrong:"θάλασσσα",right:"θάλασσα",extra:5},
{wrong:"σχολεείο",right:"σχολείο",extra:5},
{wrong:"παράθυρρο",right:"παράθυρο",extra:7},
{wrong:"παιχνίδδι",right:"παιχνίδι",extra:7},
{wrong:"υπολογισττής",right:"υπολογιστής",extra:9},
{wrong:"πληκτρολόγγιο",right:"πληκτρολόγιο",extra:10}
];
function tone(kind){if(!sound)return;try{context=context||new(window.AudioContext||window.webkitAudioContext)();if(context.state==="suspended")context.resume();let t=context.currentTime;let notes=kind==="ok"?[520,680,850]:kind==="del"?[420]:[210,180];notes.forEach((f,i)=>{let o=context.createOscillator(),g=context.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.001,t+i*.11);g.gain.exponentialRampToValueAtTime(.09,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.13);o.connect(g).connect(context.destination);o.start(t+i*.11);o.stop(t+i*.11+.14)})}catch(e){}}
soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?"🔊 Ήχος":"🔇 Σίγαση"};
function intro(){app.innerHTML=`<section class="card"><div class="hero">⌨️🪄✨</div><h1>Ο Μαγικός Σβηστήρας!</h1><p class="instructions">Ένα γράμμα μπήκε κατά λάθος σε κάθε λέξη!<br>Μετακίνησε τη <b>γραμμή που αναβοσβήνει</b> και σβήσε το παραπανίσιο γράμμα με <b>Backspace</b>.</p><button id="learn" class="btn">📚 Μάθε πώς γίνεται</button><p class="small">12 αποστολές • Χωρίς χρονόμετρο • Με βοήθεια</p></section>`;document.getElementById("learn").onclick=guide}
function guide(){app.innerHTML=`<section class="card"><h1>⌨️ Γνωρίζω το Backspace</h1><p class="instructions">Το <b>Backspace ⌫</b> βρίσκεται συνήθως <b>πάνω δεξιά</b> στο πληκτρολόγιο, στο τέλος της σειράς με τους αριθμούς.</p><div class="keyboard" aria-label="Σχεδιάγραμμα πληκτρολογίου με φωτισμένο το Backspace"><div class="keyrow">${["1","2","3","4","5","6","7","8","9","0","-","="].map(x=>`<span class="key">${x}</span>`).join("")}<span class="key backkey">⌫<br>Backspace</span></div><div class="keyrow">${["Tab","Q","W","E","R","T","Y","U","I","O","P","[","]"].map(x=>`<span class="key">${x}</span>`).join("")}</div><div class="keyrow">${["Caps","A","S","D","F","G","H","J","K","L",";","Enter"].map(x=>`<span class="key">${x}</span>`).join("")}</div><div class="keyrow">${["Shift","Z","X","C","V","B","N","M",",",".","Shift"].map(x=>`<span class="key">${x}</span>`).join("")}</div></div><div class="guide"><div class="tip"><b>1️⃣ Τι σβήνει;</b><p>Το Backspace σβήνει το γράμμα που βρίσκεται <b>ακριβώς ΑΡΙΣΤΕΡΑ</b> από τη γραμμή που αναβοσβήνει (τον δρομέα).</p><div style="font-size:28px;text-align:center;font-weight:900">μήλ<span style="background:#ffe071">λ</span><span style="color:#4b35a1">│</span>ο</div></div><div class="tip"><b>2️⃣ Πώς μετακινώ τη γραμμή;</b><p>Πατάω με το <b>ποντίκι</b> ή το <b>δάχτυλο</b> στο σημείο της λέξης όπου θέλω να μπει.</p><p>Μπορώ επίσης να χρησιμοποιήσω τα <b>βελάκια ← →</b> του πληκτρολογίου ή τα βελάκια μέσα στο παιχνίδι.</p></div><div class="tip"><b>3️⃣ Πού βάζω τη γραμμή;</b><p><b>Αμέσως ΜΕΤΑ</b> από το φωτισμένο γράμμα. Έπειτα πατάω <b>Backspace ⌫</b>.</p></div><div class="tip"><b>📱 Κινητό &amp; tablet</b><p>Πατάω στη λέξη ή στα βελάκια του παιχνιδιού για να μετακινήσω τη γραμμή και στο μεγάλο <b>⌫ Backspace</b> της οθόνης για να σβήσω.</p></div></div><div class="note">💡 Το <b>Delete</b> είναι διαφορετικό: συνήθως σβήνει το γράμμα <b>δεξιά</b> από τη γραμμή. Εδώ εξασκούμαστε στο <b>Backspace</b>.</div><button id="start" class="btn">🚀 Ξεκινάω!</button></section>`;document.getElementById("start").onclick=()=>{level=0;startLevel()}}
function startLevel(){let p=puzzles[level];word=p.wrong;caret=word.length;done=false;renderLevel("👀 Βρες το φωτισμένο γράμμα. Βάλε τη γραμμή ΑΜΕΣΩΣ ΜΕΤΑ από αυτό και πάτα Backspace ⌫.","neutral")}
function escapeHTML(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function renderLevel(message,kind){let p=puzzles[level],extra=p.extra,highlight=word===p.wrong?extra:-1;
let letters=Array.from(word);let slots=[];for(let i=0;i<=letters.length;i++){if(i===caret)slots.push('<span class="caret" aria-label="Θέση δρομέα"></span>');if(i<letters.length)slots.push(`<span class="char ${i===highlight?"bad":""}" data-pos="${i+1}" role="button" tabindex="0" aria-label="Μετακίνησε τον δρομέα μετά το γράμμα ${letters[i]}">${escapeHTML(letters[i])}</span>`)}
app.innerHTML=`<section class="card"><div class="status"><span class="pill">🧩 Λέξη ${level+1} / ${puzzles.length}</span><span class="pill">⭐ ${level} αστέρια</span></div><div class="bar"><div class="fill" style="width:${level/puzzles.length*100}%"></div></div><p class="instructions">Διόρθωσε τη λέξη ώστε να γράφει:</p><div class="goal">✨ ${p.right}</div><p class="instructions">🟨 Το <b>κίτρινο γράμμα</b> είναι το παραπανίσιο!</p><div class="editbox"><div class="chars" id="chars" role="group" aria-label="Η λέξη με μετακινούμενο δρομέα">${slots.join("")}</div></div><p class="small">Η μωβ γραμμή │ δείχνει πού βρίσκεται ο δρομέας.</p><div class="controls"><button class="btn secondary" id="left" type="button" aria-label="Μετακίνηση δρομέα αριστερά">⬅ Αριστερά</button><button class="btn" id="erase" type="button">⌫ Backspace</button><button class="btn secondary" id="right" type="button" aria-label="Μετακίνηση δρομέα δεξιά">Δεξιά ➡</button></div><div class="message ${kind==="good"?"good":kind==="warn"?"warn":""}" id="msg" role="status">${message}</div><div class="controls"><button class="btn secondary" id="help" type="button">💡 Δείξε πού μπαίνει η γραμμή</button><button class="btn secondary" id="reset" type="button">🔄 Ξανά</button></div><div id="nextArea"></div></section>`;
document.getElementById("left").onclick=()=>move(-1);document.getElementById("right").onclick=()=>move(1);document.getElementById("erase").onclick=erase;document.getElementById("help").onclick=()=>{if(done)return;caret=Math.min(extra+1,word.length);renderLevel("💡 Τώρα η γραμμή είναι ΑΜΕΣΩΣ ΜΕΤΑ από το κίτρινο γράμμα. Πάτα Backspace ⌫.","neutral")};document.getElementById("reset").onclick=startLevel;
document.querySelectorAll(".char").forEach(el=>{const place=()=>{if(done)return;caret=Number(el.dataset.pos);renderLevel("📍 Μετακίνησες τη γραμμή. Το Backspace σβήνει το γράμμα ΑΡΙΣΤΕΡΑ της.","neutral")};el.addEventListener("click",place);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();place()}})});
document.getElementById("chars").addEventListener("click",e=>{if(e.target.id==="chars"&&!done){caret=0;renderLevel("📍 Η γραμμή πήγε στην αρχή της λέξης.","neutral")}});
if(done)completeUI();
}
function move(n){if(done)return;caret=Math.max(0,Math.min(word.length,caret+n));renderLevel("📍 Η γραμμή μετακινήθηκε. Το Backspace σβήνει πάντα ΑΡΙΣΤΕΡΑ της.","neutral")}
function erase(){if(done)return;if(caret===0){tone("bad");renderLevel("⚠️ Η γραμμή είναι στην αρχή. Δεν υπάρχει γράμμα αριστερά για να σβήσεις.","warn");return}
let removed=Array.from(word)[caret-1];let arr=Array.from(word);arr.splice(caret-1,1);word=arr.join("");caret--;
if(word===puzzles[level].right){done=true;tone("ok");renderLevel("🎉 Μπράβο! Έσβησες το σωστό γράμμα με Backspace!","good");return}
tone("bad");renderLevel(`🧐 Έσβησες το «${removed}», αλλά όχι το σωστό γράμμα. Πάτα «Ξανά» και προσπάθησε!`,"warn");
document.getElementById("erase").disabled=true;document.getElementById("left").disabled=true;document.getElementById("right").disabled=true;
}
function completeUI(){const next=document.getElementById("nextArea");next.innerHTML=`<div class="stars">🌟🌟🌟</div><button class="btn" id="next">${level===puzzles.length-1?"🏆 Το βραβείο μου":"➡️ Επόμενη λέξη"}</button>`;document.getElementById("next").onclick=()=>{level++;if(level===puzzles.length)win();else startLevel()}}
function win(){app.innerHTML=`<section class="card"><div class="hero">🏆🎊⌨️</div><h1>Μάγος του Backspace!</h1><p class="instructions">Μπράβο! Έμαθες πού είναι το Backspace, πώς μετακινείται η γραμμή και ποιο γράμμα σβήνει!</p><p class="stars">⭐ ⭐ ⭐ ⭐ ⭐</p><p>Διόρθωσες και τις 12 λέξεις!</p><button class="btn" id="again">🔄 Παίζω ξανά</button></section>`;document.getElementById("again").onclick=()=>{level=0;startLevel()};tone("ok")}
physical.addEventListener("keydown",e=>{if(e.key==="Backspace"||e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();if(!document.getElementById("erase")||done)return;if(e.key==="Backspace")erase();else move(e.key==="ArrowLeft"?-1:1)}});
document.addEventListener("keydown",e=>{if(e.target===physical||e.target.tagName==="BUTTON")return;if(!document.getElementById("erase")||done)return;if(["Backspace","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();if(e.key==="Backspace")erase();else move(e.key==="ArrowLeft"?-1:1)}});
intro();
</script></body></html>
