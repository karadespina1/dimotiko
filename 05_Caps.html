<!doctype html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Το Μαγικό Μουσείο των Λέξεων</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#26304c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#48c6f1,#9174ee 55%,#fba7c8);overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #ffbb36;outline-offset:3px}.shell{width:min(920px,100%);margin:auto;padding:clamp(10px,3vw,26px)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#fff;text-shadow:0 2px 4px #0003}.brand{font-size:clamp(20px,4vw,32px);font-weight:1000}.sound{border:2px solid #fff8;background:#ffffff44;color:white;border-radius:18px;padding:10px 14px;font-weight:900}.panel{background:#fffffff2;border:4px solid white;border-radius:32px;padding:clamp(14px,3.5vw,32px);box-shadow:0 12px 0 #27305728,0 22px 45px #27305728;margin-top:16px;text-align:center;position:relative}.sub{color:#66718b;font-weight:700}.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px;font-weight:900}.progress{flex:1;min-width:100px;height:18px;border-radius:30px;background:#dfe4f3;overflow:hidden}.progress>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#42dc9d,#11b3cc);transition:width .35s}.btn{border:0;border-radius:20px;background:linear-gradient(#ffe27b,#ffad3e);color:#603e1e;padding:15px 25px;min-height:54px;font-weight:1000;box-shadow:0 6px 0 #d18b2e;transition:transform .1s}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d18b2e}.btn.secondary{background:#e5eaff;box-shadow:0 5px 0 #b5c0ec;color:#344271}.btn:disabled{opacity:.55;cursor:not-allowed}.field{display:block;width:min(570px,100%);margin:18px auto;border:4px solid #c6d7ff;border-radius:19px;background:#fff;padding:14px;font-size:clamp(20px,4.5vw,28px);text-align:center;color:#26304c;outline:none}.field:focus{border-color:#8d70f9}.message{min-height:52px;font-size:clamp(17px,3.5vw,21px);font-weight:900;color:#6249aa;margin:14px 0}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.star{font-size:clamp(50px,12vw,90px);filter:drop-shadow(0 7px 0 #0002)}h1{font-size:clamp(27px,6vw,47px);line-height:1.12;margin:12px 0}h2{font-size:clamp(23px,5vw,34px)}.credit{text-align:center;color:white;font-weight:800;font-size:13px;margin:24px 0;text-shadow:0 1px 3px #0005}.hidden{display:none!important}.confetti{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}@keyframes bob{50%{transform:translateY(-10px)}}@media(max-width:520px){.panel{border-radius:23px}.actions .btn{flex:1;min-width:130px}.hud{font-size:14px}}
.objects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:550px;margin:16px auto}.object{background:linear-gradient(#fff,#d8f7ff);border:3px solid #a4e7ff;border-radius:20px;padding:12px 4px;min-height:102px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;box-shadow:0 5px 0 #79c4e6}.object .emoji{font-size:clamp(35px,8vw,60px)}.object b{font-size:clamp(12px,3vw,17px)}.object.active{background:linear-gradient(#fff7c0,#ffd36c);border-color:#ffba48;box-shadow:0 5px 0 #db9635;transform:translateY(-3px)}.object.done{opacity:.55}.hero{font-size:clamp(65px,16vw,110px);animation:bob 2s infinite}.capital-guide{max-width:620px;margin:16px auto;padding:15px;border-radius:22px;background:#eaf7ff;border:3px solid #a7e3ff;text-align:left}.capital-guide strong{color:#4b329f}.capital-guide .method{padding:9px 0;font-weight:750}.capital-guide kbd{display:inline-block;background:white;border:2px solid #b4b9e5;border-bottom-width:5px;border-radius:9px;padding:4px 9px;font-weight:950;color:#463b85}.card-label{background:#e8f7ff;padding:12px;border-radius:15px;font-weight:900}</style><style id="responsive-mobile-tablet-desktop">
html{box-sizing:border-box;-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:inherit}
body{max-width:100%;overflow-x:hidden}

.actions,.buttons,.top,.head,.hud{flex-wrap:wrap!important}

}

</style></head><body><div class="shell"><header><div class="brand">🧸 Μαγικό Μουσείο</div><button class="sound" id="sound" aria-label="Ήχος">🔊 Ήχος</button></header><main class="panel" id="game"></main><footer class="credit">Δημιουργία: Δέσποινα Καραγιαννίδου</footer></div><script>
'use strict';
// Αλλάξτε εύκολα το περιεχόμενο στον πίνακα DATA στην αρχή του κώδικα.
const DATA=[{icon:'🍎',word:'μήλο'},{icon:'🐱',word:'γάτα'},{icon:'🌻',word:'λουλούδι'},{icon:'🚲',word:'ποδήλατο'},{icon:'🦋',word:'πεταλούδα'},{icon:'🐢',word:'χελώνα'},{icon:'☂️',word:'ομπρέλα'},{icon:'✈️',word:'αεροπλάνο'},{icon:'🍉',word:'καρπούζι'},{icon:'🐬',word:'δελφίνι'},{icon:'⌨️',word:'πληκτρολόγιο'},{icon:'🖱️',word:'ποντίκι'}];
let muted=false,ctx;const el=id=>document.getElementById(id);function sound(kind){if(muted)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(kind==='bad'?180:kind==='win'?520:440,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(kind==='bad'?130:kind==='win'?880:660,ctx.currentTime+.15);g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);o.start();o.stop(ctx.currentTime+.22)}catch(e){}}el('sound').onclick=()=>{muted=!muted;el('sound').textContent=muted?'🔇 Σίγαση':'🔊 Ήχος'};function confetti(){for(let i=0;i<70;i++){let c=document.createElement('span');c.className='confetti';c.textContent=['⭐','✨','💛','💎','🎉'][i%5];c.style.left=Math.random()*100+'vw';c.style.fontSize=14+Math.random()*16+'px';c.style.animationDuration=2+Math.random()*2+'s';c.style.animationDelay=Math.random()*.8+'s';document.body.append(c);setTimeout(()=>c.remove(),5000)}}function firstIsCapital(s){const first=[...s.trim()][0]||'';return /[Α-ΩΆΈΉΊΌΎΏΪΫ]/u.test(first)}function normalize(s){return s.trim().toLocaleLowerCase('el').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ').replace(/\s+/g,' ')}function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let index=0,wrong=0,started=false;function start(){index=0;wrong=0;started=true;render()}function render(){if(!started){el('game').innerHTML=`<div class="hero">🧸</div><h1>Το Μαγικό Μουσείο των Λέξεων</h1><p class="sub">Δες το αντικείμενο και γράψε το όνομά του. <b>Το πρώτο γράμμα πρέπει να είναι ΚΕΦΑΛΑΙΟ!</b></p><div class="capital-guide"><strong>⌨️ Θυμήσου! 2 τρόποι για κεφαλαίο:</strong><div class="method">1️⃣ Κράτα πατημένο το <kbd>Shift ⇧</kbd> και πάτησε το γράμμα.</div><div class="method">2️⃣ Πάτησε το <kbd>Caps Lock ⇪</kbd>, γράψε το γράμμα και πάτησέ το ξανά για μικρά.</div><div class="sub">📱 Στο κινητό ή tablet, πάτησε το βελάκι <kbd>⇧</kbd> στο πληκτρολόγιο.</div></div><button class="btn" id="start">▶ Το θυμήθηκα! Παίζω!</button>`;el('start').onclick=start;return}if(index>=DATA.length){sound('win');confetti();el('game').innerHTML=`<div class="star">🏆</div><h1>Μπράβο! Τα κατάφερες!</h1><p>Ονόμασες ${DATA.length} αντικείμενα!</p><p>⭐ ${DATA.length} αστέρια · ${wrong} προσπάθειες διόρθωσης</p><button class="btn" id="again">🔄 Παίζω ξανά</button>`;el('again').onclick=start;return}let d=DATA[index];el('game').innerHTML=`<div class="hud"><span>🧸 Αντικείμενο ${index+1}/${DATA.length}</span><div class="progress"><i style="width:${index/DATA.length*100}%"></i></div><span>⭐ ${index}</span></div><div class="card-label">Κοίτα την εικόνα και γράψε τη λέξη!</div><div class="objects"><div class="object active" style="grid-column:1/-1;min-height:170px"><span class="emoji" style="font-size:90px">${d.icon}</span><b>Τι είναι αυτό;</b></div></div><label for="answer" class="sub">Γράψε εδώ:</label><input class="field" id="answer" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Πληκτρολόγησε τη λέξη" maxlength="35"><div class="message" id="msg" aria-live="polite">🔠 Ξεκίνα με ΚΕΦΑΛΑΙΟ! Μπορείς να γράψεις και χωρίς τόνο.</div><div class="actions"><button class="btn" id="check">✔ Έλεγχος</button><button class="btn secondary" id="hint">💡 Βοήθεια</button></div>`;el('check').onclick=check;el('hint').onclick=()=>{el('msg').textContent='Αρχίζει από «'+d.word[0].toUpperCase()+'» και έχει '+[...d.word].length+' γράμματα.'};el('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});el('answer').focus({preventScroll:true})}function check(){let a=el('answer').value,d=DATA[index];if(!a.trim()){el('msg').textContent='✍️ Γράψε πρώτα μια λέξη!';return}if(!firstIsCapital(a)){wrong++;sound('bad');el('msg').textContent='🔠 Το πρώτο γράμμα χρειάζεται ΚΕΦΑΛΑΙΟ! Πάτησε Shift + γράμμα ή Caps Lock.';el('answer').focus();return}if(normalize(a)===normalize(d.word)){sound('good');el('msg').textContent='🌟 Σωστά! '+d.word.toUpperCase();el('check').disabled=true;el('answer').disabled=true;setTimeout(()=>{index++;render()},850)}else{wrong++;sound('bad');el('msg').textContent='💜 Δοκίμασε ξανά! Κοίτα καλά την εικόνα.';el('answer').select()}}render();
</script></body></html>
