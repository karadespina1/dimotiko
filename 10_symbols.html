<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Το Εργαστήρι των Συμβόλων</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(130deg,#b5efff,#e5d4ff 60%,#ffe5b8);font-family:system-ui,'Segoe UI',sans-serif;color:#303055;padding:14px}.wrap{max-width:820px;margin:auto}.card{background:#fffefb;border:4px solid white;border-radius:26px;padding:clamp(15px,4vw,30px);text-align:center;box-shadow:0 9px 0 #7a69b744;margin:14px auto}h1{color:#633cb3;font-size:clamp(29px,6vw,45px);margin:8px}h2{color:#6541b1}.big{font-size:clamp(19px,3vw,25px);font-weight:800}.tip{background:#fff0a6;border:3px solid #f1bb47;border-radius:17px;padding:14px;font-size:clamp(18px,3vw,24px);font-weight:900;margin:15px auto}.keys{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px auto;flex-wrap:wrap}.key{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:85px;min-height:82px;border:3px solid #b5b4cb;border-bottom:7px solid #9895b7;border-radius:13px;background:#f5f6ff;font-size:26px;font-weight:1000}.key.glow{background:#ffdc63;border-color:#f6ac36;border-bottom-color:#d8912d;box-shadow:0 0 0 5px #ffe57b88}.plus{font-size:36px;font-weight:1000;color:#7450c1}.symbol{font-size:clamp(66px,13vw,110px);font-weight:1000;color:#603cb3;line-height:1.15}.btn{cursor:pointer;border:0;border-bottom:5px solid #ce852f;border-radius:16px;background:linear-gradient(#ffe27a,#ffb94c);color:#75420e;padding:13px 20px;font-size:20px;font-weight:900;min-height:55px;margin:5px}.btn.secondary{background:#eae2ff;border-bottom-color:#a28cda;color:#513394}.btn:active{transform:translateY(3px);border-bottom-width:2px}.input{font-size:32px;font-weight:900;max-width:330px;width:100%;padding:12px;border:4px solid #ad9bea;border-radius:14px;text-align:center;color:#4a3292;background:#fff}.input:focus{outline:4px solid #ffe080}.feedback{padding:13px;border-radius:16px;background:#e9f2ff;font-size:19px;font-weight:800;min-height:60px;margin:15px auto;max-width:630px}.feedback.ok{background:#dcffe7;color:#20683c}.feedback.bad{background:#ffe8e8;color:#9d343b}.progress{font-weight:900;color:#6245b1}.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dot{width:25px;height:25px;border-radius:50%;background:#e2d9f7;border:2px solid #cabbea}.dot.done{background:#66d7a1;border-color:#31b47a}.example{background:#f0edff;border-radius:15px;padding:12px;font-size:22px;font-weight:850}.footer{text-align:center;font-size:13px;font-weight:800;color:#55457d;margin:22px}.note{font-size:15px;color:#625f76}.screenkeys{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.screenkeys button{font-size:25px;min-width:55px;padding:9px 13px}.mini{font-size:13px;font-weight:750;color:#5b5872}.symbolrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.symbolrow span{background:#f4eaff;padding:9px 12px;border-radius:10px;font-weight:900;font-size:25px}
</style><style id="responsive-mobile-tablet-desktop">
html{box-sizing:border-box;-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:inherit}
body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%;height:auto}
input,textarea,select{max-width:100%;font-size:max(16px,1em)}
textarea{resize:vertical}
button,.btn,.action{touch-action:manipulation}
@media(max-width:850px){
.wrap,.shell,.app,main,.main{max-width:100%!important;width:100%!important;margin-inline:auto!important;padding-inline:clamp(10px,2.8vw,24px)!important}
.card,.panel,.paper,.write-panel,.hero,.instructions{max-width:100%;min-width:0}
.actions,.buttons,.top,.head,.hud{flex-wrap:wrap!important}
.keyboard,.keyboard-picture,.keyboards,.focuskbd,.visual-demo{max-width:100%;overflow-x:auto!important;-webkit-overflow-scrolling:touch}
.keyrow,.kb-row{min-width:max-content}
.key,.kb-key{flex-shrink:0}
input,textarea{width:100%;min-width:0}
.example,.sample,.target,.formula,.model,.mirror,.editor,.typing,.help{max-width:100%;overflow-wrap:anywhere}
}
@media(max-width:600px){
body{margin:0!important}
h1{font-size:clamp(23px,6.7vw,32px)!important;line-height:1.2!important;overflow-wrap:anywhere}
h2{font-size:clamp(20px,5.5vw,26px)!important;overflow-wrap:anywhere}
h3{font-size:clamp(18px,5vw,22px)!important}
button,.btn,.action{min-height:46px;max-width:100%;white-space:normal}
p,.tip,.instructions,.notice,.rule,.help,.sub,.lead{overflow-wrap:anywhere}
}
@media(max-width:380px){
.wrap,.shell,.app,main,.main{padding-inline:9px!important}
button,.btn,.action{font-size:clamp(15px,4.4vw,18px)!important}
}
</style></head><body><div class="wrap"><main id="app"></main><footer class="footer">Δημιουργία: Δέσποινα Καραγιαννίδου</footer></div><script>
'use strict';
const app=document.getElementById('app');
const tasks=[{symbol:'!',digit:'1',name:'θαυμαστικό',phrase:'Μπράβο!',example:'Μπράβο!'},{symbol:'@',digit:'2',name:'παπάκι',phrase:'@',example:'Το @ υπάρχει στις διευθύνσεις email.'},{symbol:'#',digit:'3',name:'δίεση',phrase:'#',example:'#παιχνίδι'},{symbol:'$',digit:'4',name:'σύμβολο δολαρίου',phrase:'$',example:'$'},{symbol:'%',digit:'5',name:'τοις εκατό',phrase:'%',example:'50%'},{symbol:'&',digit:'7',name:'και (ampersand)',phrase:'&',example:'Α & Β'},{symbol:'*',digit:'8',name:'αστεράκι',phrase:'*',example:'*'},{symbol:'(',digit:'9',name:'αριστερή παρένθεση',phrase:'(',example:'(λέξη)'},{symbol:')',digit:'0',name:'δεξιά παρένθεση',phrase:')',example:'(λέξη)'}];
let stage=-1,done=false;
function keys(d){return `<div class="keys"><span class="key glow" aria-label="Shift">⇧<small style="font-size:18px">Shift</small></span><span class="plus">+</span><span class="key glow"><small style="font-size:20px">${tasks.find(t=>t.digit===d)?.symbol||'!'}</small>${d}</span><span class="plus">=</span><span class="symbol" style="font-size:60px">${tasks.find(t=>t.digit===d)?.symbol||'!'}</span></div>`}
function intro(){app.innerHTML=`<section class="card"><div style="font-size:64px">⌨️✨🎯</div><h1>Το Εργαστήρι των Συμβόλων!</h1><p class="big">Πώς γράφουμε τα σύμβολα στο πληκτρολόγιο;</p><div class="tip">Κρατάμε πατημένο το <b>Shift</b> και πατάμε τον σωστό αριθμό!</div>${keys('1')}<p class="big">Για το θαυμαστικό <b>!</b>: κρατάω <b>Shift</b>, πατάω <b>1</b> και μετά αφήνω τα πλήκτρα.</p><div class="example">Τέλεια<span style="background:#ffe07b;border-radius:5px;padding:0 4px">!</span> 🎉</div><p class="note">Η άσκηση χρησιμοποιεί τις συνηθισμένες θέσεις συμβόλων στο ελληνικό/αγγλικό πληκτρολόγιο υπολογιστή. Σε ορισμένες συσκευές η διάταξη διαφέρει. Σε κινητό ή tablet μπορείς να χρησιμοποιήσεις τα κουμπιά συμβόλων του παιχνιδιού.</p><button class="btn" id="start">🚀 Ξεκινάω!</button></section>`;document.getElementById('start').onclick=()=>{stage=0;render()}}
function render(msg='',kind=''){done=false;let t=tasks[stage];app.innerHTML=`<section class="card"><div class="progress">Αποστολή ${stage+1} από ${tasks.length}</div><div class="steps">${tasks.map((_,i)=>`<span class="dot ${i<stage?'done':''}"></span>`).join('')}</div><h2>Γράψε το ${t.name}</h2><div class="symbol">${t.symbol}</div>${keys(t.digit)}<div class="tip">1️⃣ Κράτα πατημένο <b>Shift</b><br>2️⃣ Πάτα <b>${t.digit}</b><br>3️⃣ Άφησε τα πλήκτρα!</div><p class="big">Γράψε εδώ το σύμβολο:</p><input id="answer" class="input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4" aria-label="Γράψε το σύμβολο ${t.name}" placeholder="?"/><div><button class="btn" id="check" type="button">✔ Έλεγχος</button><button class="btn secondary" id="help" type="button">💡 Βοήθεια</button></div><div id="msg" class="feedback ${kind}" role="status">${msg||'Πληκτρολόγησε το σύμβολο και πάτα Έλεγχος.'}</div><p class="mini">📱 Σε κινητό ή tablet μπορείς να πατήσεις το σύμβολο παρακάτω για εξάσκηση:</p><div class="screenkeys"><button class="btn secondary" id="virtual" type="button" aria-label="Εισαγωγή ${t.symbol}">${t.symbol}</button><button class="btn secondary" id="erase" type="button">⌫ Σβήνω</button></div><p class="note">Παράδειγμα χρήσης: <b>${t.example}</b></p><div id="next"></div></section>`;
document.getElementById('check').onclick=check;document.getElementById('help').onclick=()=>show(`💡 Για το ${t.name} (${t.symbol}), κράτα το Shift πατημένο και πάτα ${t.digit}. Το Shift είναι χαμηλά αριστερά ή δεξιά στο πληκτρολόγιο.`,'');document.getElementById('virtual').onclick=()=>{document.getElementById('answer').value=t.symbol;document.getElementById('answer').focus()};document.getElementById('erase').onclick=()=>{document.getElementById('answer').value='';document.getElementById('answer').focus()};document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}})}
function show(text,kind){let el=document.getElementById('msg');el.textContent=text;el.className='feedback '+kind}
function check(){if(done)return;let t=tasks[stage],v=document.getElementById('answer').value;if(v===t.symbol){done=true;show(`🌟 Μπράβο! Έγραψες σωστά το ${t.symbol}!`,'ok');document.getElementById('check').disabled=true;document.getElementById('next').innerHTML=`<button class="btn" id="advance">${stage===tasks.length-1?'🏆 Το βραβείο μου':'➡️ Επόμενο σύμβολο'}</button>`;document.getElementById('advance').onclick=()=>{stage++;if(stage===tasks.length)win();else render()};return}if(!v){show('✍️ Πρώτα γράψε το σύμβολο στο πλαίσιο!','bad');return}if(v===t.digit){show(`🔎 Έγραψες ${t.digit} αντί για ${t.symbol}. Κράτα πατημένο το Shift ενώ πατάς ${t.digit}!`,'bad');return}if(v.length>1){show('🔎 Χρειαζόμαστε ΜΟΝΟ ΕΝΑ σύμβολο. Σβήσε τα επιπλέον με Backspace.','bad');return}show(`🔎 Έγραψες «${v}». Χρειαζόμαστε «${t.symbol}». Δοκίμασε Shift + ${t.digit}.`,'bad')}
function win(){app.innerHTML=`<section class="card"><div style="font-size:85px">🏆🎊</div><h1>Μάγος των συμβόλων!</h1><p class="big">Μπράβο! Έμαθες να γράφεις 9 σύμβολα με το Shift!</p><div class="symbolrow">${tasks.map(t=>`<span>${t.symbol}</span>`).join('')}</div><div class="tip">Θυμάμαι: <b>κρατάω Shift + πατάω τον αριθμό</b>!</div><button class="btn" id="again">🔄 Παίζω ξανά</button></section>`;document.getElementById('again').onclick=()=>{stage=0;render()}}
intro();
</script></body></html>
