<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#351646">
<title>Η Νεφέλη και το χαμένο φεγγάρι</title>
<style>
*{box-sizing:border-box}
:root{color:#fff2d5;background:#281039;font-family:Nunito,system-ui,sans-serif;color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#63326d,#281039 72%)}
main{max-width:920px;margin:auto;padding:clamp(8px,3vw,26px)}
[hidden]{display:none!important}
h1,p{margin:0}
h1{font-size:clamp(22px,5vw,45px);line-height:1.03;letter-spacing:-.04em}
button{font:inherit;font-weight:850;cursor:pointer;touch-action:manipulation;color:#351646;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid white;outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tools{display:flex;gap:7px}
.tool,.play{min-width:46px;min-height:46px;border:2px solid #fff1bd;border-radius:15px;background:#ffd470;padding:6px 10px;font-size:22px;box-shadow:0 3px #a75d66}
.curtains{position:relative;border:2px solid #dd7f98;border-radius:28px;padding:11px;background:repeating-linear-gradient(100deg,#7d215a 0 10px,#ab386e 22px,#7d215a 35px);box-shadow:0 14px 50px #130821b0;overflow:hidden}
.curtains::before,.curtains::after{content:"";position:absolute;z-index:5;pointer-events:none;top:-16px;width:30%;height:48px;border-radius:0 0 70% 35%;background:linear-gradient(#b93672,#741d54);border-bottom:3px solid #f6ad8f}
.curtains::before{left:0;transform:rotate(-9deg)}
.curtains::after{right:0;transform:scaleX(-1) rotate(-9deg)}
#stage{position:relative;isolation:isolate;height:clamp(350px,66svh,530px);border-radius:21px;overflow:hidden;background:var(--sky,#6352a8);transition:background .45s ease}
#stage[data-chapter="0"]{--sky:#514185}
#stage[data-chapter="1"]{--sky:#718bce}
#stage[data-chapter="2"]{--sky:#6256a7}
#stage[data-chapter="3"]{--sky:#4a3e85}
#stage[data-chapter="4"]{--sky:#483484}
.scene{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.star{position:absolute;width:5px;aspect-ratio:1;border-radius:50%;background:#fff0a8;box-shadow:0 0 12px #fff3cf;animation:twinkle 2.1s ease-in-out infinite alternate}
.hill{position:absolute;left:-17%;bottom:-29%;width:90%;height:53%;border-radius:50%;background:#8da2cf;transform:rotate(-8deg)}
.hill.right{left:auto;right:-22%;width:92%;height:48%;background:#b5a2de;transform:rotate(8deg)}
#stage[data-chapter="1"] .hill{background:#94d0bd}
.river{position:absolute;inset:57% -10% 0;background:repeating-linear-gradient(3deg,#45aeca 0 20px,#66cddd 21px 28px,#45aeca 36px 51px);border-radius:50% 55% 0 0;opacity:.9;animation:water 3.5s ease-in-out infinite alternate}
.prop,.actor{position:absolute;display:grid;place-items:center;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-size:clamp(32px,10vw,77px);line-height:1;filter:drop-shadow(0 5px 3px #2d1b525c);user-select:none}
.actor{font-size:clamp(47px,14vw,97px);z-index:1;transition:left .55s ease,top .55s ease}
.actor span,.drift span{display:inline-block;animation:bob 2.2s ease-in-out infinite}
.glow{position:absolute;left:var(--x);top:var(--y);width:45%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(#fff0a98c,transparent 68%);animation:appear .6s ease both}
.target{position:absolute;z-index:3;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:grid;place-items:center;width:clamp(65px,18vw,96px);height:clamp(65px,18vw,96px);padding:0;border:3px solid #fff3c5;border-radius:24px;background:#fff0ce;box-shadow:0 5px #674665,0 0 20px #ffe7a1b8;font-size:clamp(35px,10vw,62px);line-height:1}
.target span{pointer-events:none;animation:bob 1.1s ease-in-out infinite}
.target:hover{background:#fff9e9}
.target:active{margin-top:3px}
.particles{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;animation:scatter .72s ease-out forwards}
.panel{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:10px;background:#29153b52}
.paper{text-align:center;background:#3a2059ed;border:2px solid #f7c0a2;border-radius:23px;padding:15px;max-width:94%;box-shadow:0 10px 32px #2b173d91}
.paper .big{font-size:clamp(48px,15vw,85px)}
.paper p{margin:8px 0}
.play{font-size:clamp(17px,4vw,22px);padding:8px 14px}
.footer{display:flex;align-items:center;gap:10px;margin-top:9px}
#cue{background:#f6d283;color:#3b2051;display:grid;place-items:center;min-width:76px;height:43px;border-radius:13px;font-size:25px;line-height:1}
#tip{line-height:1.25;font-size:clamp(13px,3vw,17px)}
#chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}
#chapters span{height:7px;border-radius:9px;background:#72446f}
#chapters .lit{background:#ffd871}
#chapters .current{background:#f29ec4}
@keyframes twinkle{to{opacity:.33;scale:.7}}
@keyframes bob{50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes water{to{transform:translateX(15px) translateY(5px)}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes scatter{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media(max-width:450px){.curtains{padding:7px;border-radius:21px}.tools{gap:4px}.tool{min-width:44px;padding:5px}.bar{gap:5px}}
@media(max-height:525px) and (orientation:landscape){#stage{height:285px}.target{width:60px;height:60px;font-size:34px}.actor{font-size:52px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.spark{display:none}}
.effect{animation-duration:1.25s;animation-fill-mode:forwards;z-index:2}
.effect.sailing{animation-name:sailing}
.effect.vanishing{animation-name:vanishing}
.effect.rising{animation-name:rising}
@keyframes sailing{to{transform:translate(-250%,-90%) rotate(-10deg);opacity:0}}
@keyframes vanishing{to{transform:translate(-170%,-110%) scale(.7);opacity:0}}
@keyframes rising{to{transform:translate(-50%,-175%) scale(.65);opacity:0}}
</style>
</head>
<body>
<main>
<header class="bar"><h1>Η Νεφέλη και το χαμένο φεγγάρι</h1><div class="tools"><button id="restart" class="tool" aria-label="Από την αρχή" type="button" hidden>↶</button><button id="voice" class="tool" aria-label="Άκου ξανά" type="button" hidden>🔊</button></div></header>
<div class="curtains"><div id="stage">
<div id="scene" class="scene" aria-hidden="true"></div>
<div id="actor" class="actor" aria-hidden="true"><span>🐧</span></div>
<div id="props" class="scene" aria-hidden="true"></div>
<div id="objects"></div>
<div id="particles" class="particles" aria-hidden="true"></div>
<div id="panel" class="panel"><div class="paper"><div class="big" id="panel-icon" aria-hidden="true">🐧</div><p id="panel-text">Το φεγγάρι χάθηκε. Θα βοηθήσεις τη Νεφέλη;</p><button id="play" class="play" type="button">▶ Παίζουμε!</button></div></div>
</div></div>
<div id="footer" class="footer" hidden><span id="cue" aria-hidden="true"></span><p id="tip" role="status"></p></div>
<div id="chapters" aria-hidden="true" hidden></div>
</main>

  touch:'Το φεγγάρι χάθηκε! Άγγιξε τον φακό μία φορά για να ανάψει.',
  end:'Μπράβο! Η Νεφέλη βρήκε το φεγγάρι χάρη σε σένα.'
};
const $ = id => document.getElementById(id);
let chapter = 0, step = 0, state = 'opening', player;
let touch = matchMedia('(pointer: coarse)').matches;
let currentVoice;
const shortMotion = matchMedia('(prefers-reduced-motion: reduce)');

function speak(key, text) {
  player?.pause();
  window.speechSynthesis?.cancel();
  const fallback = () => {
    const greek = window.speechSynthesis?.getVoices().find(voice => voice.lang.startsWith('el'));
    if (!greek) return;
    const line = new SpeechSynthesisUtterance(text);
    line.voice = greek;
    line.lang = 'el-GR';
    window.speechSynthesis.speak(line);
  };
  currentVoice = () => speak(key,text);
  if (!recordings[key]) { fallback(); return; }
  const clip = new Audio(recordings[key]);
  player = clip;
  clip.play().catch(() => { if (player === clip) fallback(); });
}

function position(el,x,y) {
  el.style.setProperty('--x',x+'%');
  el.style.setProperty('--y',y+'%');
}
function piece(className, icon, x, y) {
  const node = document.createElement('div');
  node.className = className;
  if (x !== undefined) position(node,x,y);
  if (icon) {
    const picture = document.createElement('span');
    picture.textContent = icon;
    node.append(picture);
  }
  return node;
}
function setBackground() {
  const scene = $('scene');
  scene.replaceChildren();
  for (let i=0;i<22;i++) {
    const star = document.createElement('i');
    star.className = 'star';
    star.style.left = (8+i*37)%96+'%';
    star.style.top = (4+i*11)%66+'%';
    star.style.animationDelay = (-i*.21)+'s';
    scene.append(star);
  }
  for (const name of ['hill','hill right']) {
    const hill = document.createElement('div');
    hill.className = name;
    scene.append(hill);
  }
}

function draw(focus) {
  const scene = story[chapter][step];
  $('stage').dataset.chapter = chapter;
  $('panel').hidden = true;
  $('footer').hidden = $('chapters').hidden = false;
  $('cue').textContent = '👆 ' + scene.icon;
  $('tip').textContent = scene.text;
  position($('actor'),...scene.actor);
  const props = $('props');
  props.replaceChildren();
  if (scene.river) props.append(piece('river'));
  if (scene.glow) props.append(piece('glow','',...scene.glow));
  if (scene.prop) props.append(piece('prop drift',...scene.prop));
  const target = document.createElement('button');
  target.type = 'button';
  target.className = 'target';
  target.setAttribute('aria-label',scene.name);
  position(target,scene.x,scene.y);
  const image = document.createElement('span');
  image.textContent = scene.icon;
  target.append(image);
  target.addEventListener('click',event=>{
    if (event.button !== 0 || !target.isConnected || state !== 'playing') return;
    burst(scene.x,scene.y);
    advance(event.detail === 0,scene);
  });
  $('objects').replaceChildren(target);
  const chapters = $('chapters');
  chapters.replaceChildren();
  story.forEach((_,i)=>{
    const bar = document.createElement('span');
    bar.className = i < chapter ? 'lit' : (i === chapter ? 'current' : '');
    chapters.append(bar);
  });
  if (focus) target.focus();
}
function voiceStep() {
  speak('step'+chapter+'-'+step,story[chapter][step].text);
}
function play() {
  chapter = step = 0;
  state = 'playing';
  $('restart').hidden = $('voice').hidden = false;
  $('particles').replaceChildren();
  draw(true);
  const mode = touch ? 'touch' : 'mouse';
  speak(mode,words[mode]);
}
function advance(focus,scene) {
  if (step + 1 < story[chapter].length) step++;
  else {
    chapter++;
    step = 0;
  }
  if (chapter === story.length) {
    state = 'ended';
    $('objects').replaceChildren();
    $('footer').hidden = true;
    $('panel-icon').textContent = '🐧🌕';
    $('panel-text').textContent = words.end;
    $('play').textContent = '↶ Παίξε ξανά';
    $('panel').hidden = false;
    for (const bar of $('chapters').children) bar.className = 'lit';
    $('props').append(piece('prop','🌕',30,29));
    if (focus) $('play').focus();
    speak('end',words.end);
    return;
  }
  draw(focus);
  voiceStep();
  if (scene.icon === '⛵') effect('⛵','sailing',79,79);
  if (scene.icon === '☁️') effect('☁️','vanishing',27,36);
  if (scene.icon === '🌙') effect('🌙','rising',73,30);
}
function effect(icon,motion,x,y) {
  if (shortMotion.matches) return;
  const object = piece('prop effect '+motion,icon,x,y);
  $('particles').append(object);
  setTimeout(()=>object.remove(),1300);
}
function burst(x,y) {
  if (shortMotion.matches) return;
  const colors=['#ffb4d2','#ffe481','#a8f5dd','#ffc08e','#d5bcff'];
  for(let i=0;i<18;i++){
    const dot=document.createElement('i');
    const angle=i*Math.PI/9;
    const distance=23+i%5*13;
    dot.className='spark';
    dot.style.left=x+'%';dot.style.top=y+'%';
    dot.style.background=colors[i%colors.length];
    dot.style.setProperty('--dx',Math.cos(angle)*distance+'px');
    dot.style.setProperty('--dy',Math.sin(angle)*distance+'px');
    $('particles').append(dot);
    setTimeout(()=>dot.remove(),740);
  }
}
setBackground();
position($('actor'),40,70);
document.addEventListener('pointerdown',event=>{
  if(event.pointerType) touch=event.pointerType==='touch'||event.pointerType==='pen';
},{passive:true});
$('play').addEventListener('click',play);
$('restart').addEventListener('click',play);
$('voice').addEventListener('click',()=>{
  if(state==='playing') voiceStep();
  else currentVoice?.();
});
$('stage').addEventListener('contextmenu',event=>event.preventDefault());
</script>
</body>
